
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | SPMS</title>

    <script src="/JS/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #6dd5ed,
                #2193b0
            );
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Background circles */

        .circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .circle.one {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .circle.two {
            width: 250px;
            height: 250px;
            bottom: -80px;
            right: -80px;
        }

        .circle.three {
            width: 150px;
            height: 150px;
            top: 45%;
            left: 5%;
        }

        /* Main card */

        .register-card {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 5;
            backdrop-filter: blur(10px);
        }

        .register-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .register-card .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        /* Form */

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* Password */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        /* Resume */

        .resume-note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        /* Button */

        .register-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Message at bottom */

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Login link */

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Theme button */

        .theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Dark mode */

        body.dark {
            background: linear-gradient(
                135deg,
                #141e30,
                #243b55,
                #182848,
                #4b6cb7
            );
            background-size: 400% 400%;
        }

        body.dark .register-card {
            background: rgba(25, 25, 35, 0.96);
            color: white;
        }

        body.dark .register-card h1 {
            color: white;
        }

        body.dark .register-card .subtitle {
            color: #bbb;
        }

        body.dark .form-group label {
            color: #eee;
        }

        body.dark .form-group input,
        body.dark .form-group select {
            background: #2d2d3a;
            color: white;
            border-color: #555;
        }

        body.dark .resume-note {
            color: #aaa;
        }

        body.dark .login-link {
            color: #bbb;
        }

        body.dark .theme-btn {
            background: #2d2d3a;
            color: white;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .register-card {
                padding: 25px 18px;
                border-radius: 16px;
            }

            .register-card h1 {
                font-size: 25px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .circle.one {
                width: 180px;
                height: 180px;
            }

            .circle.two {
                width: 160px;
                height: 160px;
            }

            .circle.three {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <!-- Theme -->

    <button
        type="button"
        class="theme-btn"
        id="themeBtn">
        🌙
    </button>

    <!-- Registration Card -->

    <div class="register-card">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Create your Smart Placement Management account
        </p>

        <form
            id="registerForm"
            action="/students"
            method="POST"
            enctype="multipart/form-data">

            <!-- Name + Email -->

            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>

            <!-- Phone + Branch -->

            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>

                </div>

                <div class="form-group">

                    <label for="branch">
                        Branch
                    </label>

                    <select
                        id="branch"
                        name="branch"
                        required>

                        <option value="">
                            Select Branch
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            MECH
                        </option>

                        <option value="CIVIL">
                            CIVIL
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="AI & DS">
                            AI & DS
                        </option>

                    </select>

                </div>

            </div>

            <!-- Password + Confirm Password -->

            <div class="form-row">

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('password', this)">
                            👁
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)">
                            👁
                        </button>

                    </div>

                </div>

            </div>

            <!-- CGPA -->

            <div class="form-group">

                <label for="cgpa">
                    CGPA
                </label>

                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    placeholder="Enter CGPA"
                    min="0"
                    max="10"
                    step="0.01"
                    required>

            </div>

            <!-- Resume -->

            <div class="form-group">

                <label for="resume">
                    Resume
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,application/pdf"
                    required>

                <div class="resume-note">
                    Upload your resume in PDF format only.
                </div>

            </div>

            <!-- Register -->

            <button
                type="submit"
                class="register-btn">
                Register
            </button>

        </form>

        <!-- Message at bottom -->

        <div
            id="message"
            class="message">
        </div>

        <!-- Login -->

        <div class="login-link">

            Already have an account?

            <a href="/login.html">
                Login here
            </a>

        </div>

    </div>


    <script>

        /* =========================
           Password Toggle
           ========================= */

        function togglePassword(
            inputId,
            button
        ) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";

            }
        }


        /* =========================
           Form Validation
           ========================= */

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                function(event) {

                    const password =
                        document.getElementById(
                            "password"
                        ).value;

                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;

                    const phone =
                        document.getElementById(
                            "phone"
                        ).value;

                    const cgpa =
                        parseFloat(
                            document.getElementById(
                                "cgpa"
                            ).value
                        );

                    const resume =
                        document.getElementById(
                            "resume"
                        ).files[0];

                    const message =
                        document.getElementById(
                            "message"
                        );


                    /* Password */

                    if (
                        password !==
                        confirmPassword
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "✗ Passwords do not match.";

                        message.className =
                            "message error";

                        return;
                    }


                    /* Phone */

                    if (
                        !/^\d{10}$/.test(phone)
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "✗ Phone number must contain exactly 10 digits.";

                        message.className =
                            "message error";

                        return;
                    }


                    /* CGPA */

                    if (
                        isNaN(cgpa) ||
                        cgpa < 0 ||
                        cgpa > 10
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "✗ CGPA must be between 0 and 10.";

                        message.className =
                            "message error";

                        return;
                    }


                    /* Resume */

                    if (!resume) {

                        event.preventDefault();

                        message.textContent =
                            "✗ Please select your resume.";

                        message.className =
                            "message error";

                        return;
                    }


                    if (
                        resume.type !==
                            "application/pdf" &&
                        !resume.name
                            .toLowerCase()
                            .endsWith(".pdf")
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "✗ Resume must be a PDF file.";

                        message.className =
                            "message error";

                        return;
                    }

                }
            );


        /* =========================
           Theme
           ========================= */

        const themeBtn =
            document.getElementById(
                "themeBtn"
            );

        const savedTheme =
            localStorage.getItem(
                "theme"
            );

        if (savedTheme === "dark") {

            document.body.classList.add(
                "dark"
            );

            themeBtn.textContent = "☀️";

        }


        themeBtn.addEventListener(
            "click",
            function() {

                document.body.classList.toggle(
                    "dark"
                );

                if (
                    document.body.classList.contains(
                        "dark"
                    )
                ) {

                    localStorage.setItem(
                        "theme",
                        "dark"
                    );

                    themeBtn.textContent =
                        "☀️";

                } else {

                    localStorage.setItem(
                        "theme",
                        "light"
                    );

                    themeBtn.textContent =
                        "🌙";
                }

            }
        );


        /* =========================
           Registration Result
           ========================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const success =
            urlParams.get("success");

        const existing =
            urlParams.get("existing");

        const message =
            document.getElementById(
                "message"
            );


        if (success === "true") {

            message.textContent =
                "✓ Registration successful! Redirecting to login...";

            message.className =
                "message success";

            /*
             * Redirect immediately — no delay
             */
            window.location.replace(
                "/login.html"
            );
        }


        if (existing === "true") {

            message.textContent =
                "✓ Account already exists! Redirecting to login...";

            message.className =
                "message error";

            // Keep message visible for 2 seconds
            setTimeout(() => {
                window.location.replace("/login.html");
            }, 2000);
        }
    </script>

</body>

</html>
