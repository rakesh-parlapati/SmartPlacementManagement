
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | SPMS</title>

    <!-- GLOBAL AUTH + THEME -->
    <script src="/JS/auth.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            padding: 30px 15px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            position: relative;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .theme-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            border: none;
            background: #eff6ff;
            color: #2563eb;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.25s;
        }

        .theme-btn:hover {
            background: #dbeafe;
        }

        .title {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
            color: #1e293b;
            transition: 0.25s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
            color: #1e293b;
            transition: 0.25s;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .view-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.25s;
        }

        .register-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.20);
        }

        .register-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            min-height: 20px;
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        .login-link p {
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
        }

        body.dark-mode .register-container {
            background: #1e293b;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
        }

        body.dark-mode .title {
            color: #60a5fa;
        }

        body.dark-mode .subtitle {
            color: #94a3b8;
        }

        body.dark-mode label {
            color: #e2e8f0;
        }

        body.dark-mode input {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #475569;
        }

        body.dark-mode input::placeholder {
            color: #94a3b8;
        }

        body.dark-mode input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        body.dark-mode select {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #475569;
        }

        body.dark-mode select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        body.dark-mode .theme-btn {
            background: #334155;
            color: #facc15;
        }

        body.dark-mode .theme-btn:hover {
            background: #475569;
        }

        body.dark-mode .login-link {
            border-top-color: #475569;
        }

        body.dark-mode .login-link p {
            color: #94a3b8;
        }

        body.dark-mode .login-link a {
            color: #60a5fa;
        }

        @media (max-width: 500px) {

            body {
                padding: 20px 12px;
                align-items: flex-start;
            }

            .register-container {
                margin-top: 20px;
                padding: 30px 22px;
            }

            .title {
                font-size: 24px;
            }

            .theme-btn {
                top: 12px;
                right: 12px;
            }

            input,
            select {
                font-size: 16px;
            }

            .register-btn {
                font-size: 16px;
                min-height: 48px;
            }
        }

    </style>

</head>


<body>

<div class="register-container">

    <!-- DARK MODE -->
    <button
        type="button"
        class="theme-btn"
        onclick="toggleDarkMode()">

        🌙 Dark Mode

    </button>


    <h2 class="title">
        Student Registration
    </h2>


    <p class="subtitle">
        Create your account for Smart Placement Management System
    </p>


    <!-- REGISTRATION FORM -->
    <!-- IMPORTANT: Normal multipart form submission -->
    <form
        id="registerForm"
        action="/students"
        method="POST"
        enctype="multipart/form-data">


        <!-- STUDENT NAME -->
        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required>

        </div>


        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>


        <!-- PHONE -->
        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                pattern="[0-9]{10}"
                inputmode="numeric"
                autocomplete="tel"
                required>

        </div>


        <!-- BRANCH -->
        <div class="form-group">

            <label for="branch">
                Branch
            </label>

            <select
                id="branch"
                name="branch"
                required>

                <option value="">
                    Select your branch
                </option>

                <option value="ECE">
                    Electronics & Communication Engineering (ECE)
                </option>

                <option value="CSE">
                    Computer Science & Engineering (CSE)
                </option>

                <option value="EEE">
                    Electrical & Electronics Engineering (EEE)
                </option>

                <option value="ME">
                    Mechanical Engineering (ME)
                </option>

                <option value="CE">
                    Civil Engineering (CE)
                </option>

                <option value="IT">
                    Information Technology (IT)
                </option>

                <option value="AI & DS">
                    Artificial Intelligence & Data Science (AI & DS)
                </option>

                <option value="AI & ML">
                    Artificial Intelligence & Machine Learning (AI & ML)
                </option>

            </select>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required>

                <button
                    type="button"
                    class="view-password"
                    onclick="togglePassword('password', this)">

                    👁

                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required>

                <button
                    type="button"
                    class="view-password"
                    onclick="togglePassword('confirmPassword', this)">

                    👁

                </button>

            </div>

        </div>


        <!-- CGPA -->
        <div class="form-group">

            <label for="cgpa">
                CGPA
            </label>

            <input
                type="number"
                id="cgpa"
                name="cgpa"
                min="0"
                max="10"
                step="0.01"
                placeholder="Enter CGPA (0 - 10)"
                inputmode="decimal"
                required>

        </div>


        <!-- RESUME -->
        <div class="form-group">

            <label for="resume">
                Resume (PDF)
            </label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,application/pdf"
                required>

        </div>


        <!-- REGISTER BUTTON -->
        <button
            type="submit"
            class="register-btn"
            id="registerBtn">

            Register

        </button>

    </form>


    <!-- MESSAGE -->
    <div
        id="message"
        class="message">
    </div>


    <!-- LOGIN -->
    <div class="login-link">

        <p>

            Already have an account?

            <a href="/login.html">
                Login Here
            </a>

        </p>

    </div>

</div>


<script>

    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    function togglePassword(fieldId, button) {

        const field =
            document.getElementById(fieldId);

        if (field.type === "password") {

            field.type = "text";

            button.textContent = "🙈";

        } else {

            field.type = "password";

            button.textContent = "👁";

        }
    }


    // ==========================================
    // REGISTRATION VALIDATION
    // ==========================================

    document
        .getElementById("registerForm")
        .addEventListener("submit", function(event) {

            const name =
                document.getElementById("name")
                    .value.trim();

            const email =
                document.getElementById("email")
                    .value.trim();

            const phone =
                document.getElementById("phone")
                    .value.trim();

            const branch =
                document.getElementById("branch")
                    .value;

            const password =
                document.getElementById("password")
                    .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value;

            const cgpa =
                parseFloat(
                    document.getElementById("cgpa")
                        .value
                );

            const resume =
                document.getElementById("resume")
                    .files[0];

            const message =
                document.getElementById("message");

            const registerBtn =
                document.getElementById("registerBtn");


            // ==========================================
            // VALIDATION
            // ==========================================

            if (!name) {

                event.preventDefault();

                message.textContent =
                    "Please enter your name.";

                return;
            }


            if (!email) {

                event.preventDefault();

                message.textContent =
                    "Please enter your email.";

                return;
            }


            if (!/^[0-9]{10}$/.test(phone)) {

                event.preventDefault();

                message.textContent =
                    "Phone number must contain exactly 10 digits.";

                return;
            }


            if (!branch) {

                event.preventDefault();

                message.textContent =
                    "Please select your branch.";

                return;
            }


            if (password.length < 6) {

                event.preventDefault();

                message.textContent =
                    "Password must contain at least 6 characters.";

                return;
            }


            if (password !== confirmPassword) {

                event.preventDefault();

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {

                event.preventDefault();

                message.textContent =
                    "CGPA must be between 0 and 10.";

                return;
            }


            if (!resume) {

                event.preventDefault();

                message.textContent =
                    "Please select your resume.";

                return;
            }


            if (!resume.name.toLowerCase().endsWith(".pdf")) {

                event.preventDefault();

                message.textContent =
                    "Only PDF resume is allowed.";

                return;
            }


            // ==========================================
            // ALLOW NORMAL FORM SUBMISSION
            // ==========================================

            registerBtn.disabled = true;

            registerBtn.textContent =
                "Registering...";

            message.textContent =
                "Uploading resume and registering...";

            message.style.color =
                "#2563eb";

            /*
             * IMPORTANT:
             *
             * We intentionally DO NOT use fetch()
             * here.
             *
             * The browser will submit:
             *
             * POST /students
             *
             * as multipart/form-data.
             */

        });

</script>


</body>

</html>
