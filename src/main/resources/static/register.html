
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | SPMS</title>

    <!-- GLOBAL AUTH + THEME -->
    <script src="/JS/auth.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* ==============================
           BODY + ANIMATED BACKGROUND
        ============================== */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                120deg,
                #e0f2fe,
                #dbeafe,
                #eff6ff,
                #dbeafe
            );

            background-size: 400% 400%;

            animation:
                backgroundMove 12s ease infinite;

            padding: 20px;

            overflow-x: hidden;

            position: relative;

            transition:
                background 0.3s,
                color 0.3s;
        }

        /* ==============================
           BACKGROUND ANIMATION
        ============================== */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ==============================
           BACKGROUND CIRCLES
        ============================== */

        .background-circle {
            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;
        }

        .circle-one {
            width: 300px;
            height: 300px;

            background:
                rgba(96, 165, 250, 0.22);

            top: -100px;
            left: -100px;

            animation:
                circleOne 10s ease-in-out infinite;
        }

        .circle-two {
            width: 350px;
            height: 350px;

            background:
                rgba(147, 197, 253, 0.28);

            right: -120px;
            bottom: -120px;

            animation:
                circleTwo 12s ease-in-out infinite;
        }

        .circle-three {
            width: 180px;
            height: 180px;

            background:
                rgba(125, 211, 252, 0.20);

            right: 20%;
            top: 8%;

            animation:
                circleThree 8s ease-in-out infinite;
        }

        @keyframes circleOne {

            0%, 100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(120px, 100px)
                    scale(1.15);
            }
        }

        @keyframes circleTwo {

            0%, 100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(-100px, -100px)
                    scale(1.12);
            }
        }

        @keyframes circleThree {

            0%, 100% {
                transform:
                    translate(0, 0);
            }

            50% {
                transform:
                    translate(-70px, 90px);
            }
        }

        /* ==============================
           PARTICLES
        ============================== */

        .particles {
            position: absolute;

            inset: 0;

            z-index: 1;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            background:
                rgba(37, 99, 235, 0.35);

            border-radius: 50%;

            animation:
                particleFloat 8s linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 80%;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            left: 20%;
            top: 60%;
            animation-duration: 10s;
        }

        .particle:nth-child(3) {
            left: 35%;
            top: 90%;
            animation-duration: 9s;
        }

        .particle:nth-child(4) {
            left: 50%;
            top: 75%;
            animation-duration: 11s;
        }

        .particle:nth-child(5) {
            left: 65%;
            top: 85%;
            animation-duration: 10s;
        }

        .particle:nth-child(6) {
            left: 75%;
            top: 50%;
            animation-duration: 12s;
        }

        .particle:nth-child(7) {
            left: 85%;
            top: 75%;
            animation-duration: 9s;
        }

        .particle:nth-child(8) {
            left: 92%;
            top: 35%;
            animation-duration: 11s;
        }

        @keyframes particleFloat {

            0% {
                transform:
                    translateY(0)
                    scale(0.5);

                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            50% {
                transform:
                    translateY(-220px)
                    scale(1);

                opacity: 0.7;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform:
                    translateY(-450px)
                    scale(0.3);

                opacity: 0;
            }
        }

        /* ==============================
           REGISTRATION CARD
        ============================== */

        .register-container {
            width: 100%;

            max-width: 500px;

            background:
                rgba(255, 255, 255, 0.97);

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(30, 64, 175, 0.18);

            position: relative;

            z-index: 5;

            animation:
                cardEnter 0.8s ease;

            transition:
                background 0.3s,
                box-shadow 0.3s;
        }

        @keyframes cardEnter {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.95);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* ==============================
           THEME BUTTON
        ============================== */

        .theme-btn {
            position: absolute;

            top: 15px;
            right: 15px;

            border: none;

            border-radius: 7px;

            background: #111827;

            color: white;

            padding: 8px 12px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .theme-btn:hover {
            opacity: 0.85;
        }

        /* ==============================
           TITLE
        ============================== */

        .title {
            text-align: center;

            margin-top: 20px;

            margin-bottom: 8px;

            color: #1e293b;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 25px;

            font-size: 14px;
        }

        /* ==============================
           FORM
        ============================== */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #334155;

            font-size: 14px;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            background: white;

            color: #1e293b;

            outline: none;

            transition: 0.25s;
        }

        input:focus,
        select:focus {

            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px
                rgba(96, 165, 250, 0.15);
        }

        select {
            cursor: pointer;
        }

        /* ==============================
           PASSWORD
        ============================== */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .view-password {
            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            padding: 5px;
        }

        /* ==============================
           REGISTER BUTTON
        ============================== */

        .register-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #3b82f6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.25s;
        }

        .register-btn:hover {
            background: #2563eb;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.25);
        }

        .register-btn:disabled {
            background: #93c5fd;

            cursor: not-allowed;

            transform: none;
        }

        /* ==============================
           MESSAGE
        ============================== */

        .message {
            text-align: center;

            min-height: 20px;

            margin-top: 16px;

            font-size: 14px;

            font-weight: bold;

            word-break: break-word;
        }

        .success-message {
            background: #dcfce7;

            color: #166534;

            border:
                1px solid #86efac;

            padding: 12px;

            border-radius: 8px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }

        /* ==============================
           LOGIN LINK
        ============================== */

        .login-link {
            text-align: center;

            margin-top: 22px;

            padding-top: 18px;

            border-top:
                1px solid #e2e8f0;
        }

        .login-link p {
            color: #64748b;

            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

            margin-left: 5px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ==============================
           DARK MODE
        ============================== */

        body.dark-mode {
            background: #111827;
        }

        body.dark-mode .register-container {
            background:
                rgba(31, 41, 55, 0.97);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);
        }

        body.dark-mode .title {
            color: #f3f4f6;
        }

        body.dark-mode .subtitle {
            color: #cbd5e1;
        }

        body.dark-mode label {
            color: #e5e7eb;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #374151;

            color: #f3f4f6;

            border-color: #4b5563;
        }

        body.dark-mode input::placeholder {
            color: #9ca3af;
        }

        body.dark-mode input:focus,
        body.dark-mode select:focus {
            border-color: #60a5fa;
        }

        body.dark-mode .login-link {
            border-top-color:
                #4b5563;
        }

        body.dark-mode .login-link p {
            color: #cbd5e1;
        }

        body.dark-mode .login-link a {
            color: #60a5fa;
        }

        body.dark-mode .theme-btn {
            background: #f3f4f6;

            color: #111827;
        }

        body.dark-mode .success-message {
            background: #14532d;

            color: #bbf7d0;

            border-color: #166534;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 500px) {

            body {
                padding: 20px 12px;

                align-items: flex-start;

                overflow-x: hidden;
            }

            .register-container {
                margin-top: 20px;

                padding: 35px 25px;

                border-radius: 15px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 13px;
            }

            .circle-one {
                width: 200px;
                height: 200px;
            }

            .circle-two {
                width: 230px;
                height: 230px;
            }

            .circle-three {
                width: 130px;
                height: 130px;
            }

            .theme-btn {
                top: 12px;
                right: 12px;
            }

            input,
            select {
                font-size: 16px;
            }

            .register-btn {
                font-size: 16px;

                min-height: 48px;
            }
        }

    </style>

</head>

<body>

    <!-- ==========================================
         BACKGROUND ANIMATION
    =========================================== -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="background-circle circle-three"></div>

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- ==========================================
         REGISTRATION CARD
    =========================================== -->

    <div class="register-container">

        <button
            type="button"
            class="theme-btn"
            onclick="toggleDarkMode()">

            🌙 Dark Mode

        </button>


        <h2 class="title">

            Student Registration

        </h2>


        <p class="subtitle">

            Create your account for

            Smart Placement Management System

        </p>


        <!-- REGISTRATION FORM -->

        <form
            id="registerForm"
            action="/students"
            method="POST"
            enctype="multipart/form-data">


            <!-- STUDENT NAME -->

            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    autocomplete="tel"
                    required>

            </div>


            <!-- BRANCH -->

            <div class="form-group">

                <label for="branch">
                    Branch
                </label>

                <select
                    id="branch"
                    name="branch"
                    required>

                    <option value="">
                        Select your branch
                    </option>

                    <option value="ECE">
                        Electronics & Communication Engineering (ECE)
                    </option>

                    <option value="CSE">
                        Computer Science & Engineering (CSE)
                    </option>

                    <option value="EEE">
                        Electrical & Electronics Engineering (EEE)
                    </option>

                    <option value="ME">
                        Mechanical Engineering (ME)
                    </option>

                    <option value="CE">
                        Civil Engineering (CE)
                    </option>

                    <option value="IT">
                        Information Technology (IT)
                    </option>

                    <option value="AI & DS">
                        Artificial Intelligence & Data Science (AI & DS)
                    </option>

                    <option value="AI & ML">
                        Artificial Intelligence & Machine Learning (AI & ML)
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="view-password"
                        onclick="togglePassword('password', this)">

                        👁

                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="view-password"
                        onclick="togglePassword('confirmPassword', this)">

                        👁

                    </button>

                </div>

            </div>


            <!-- CGPA -->

            <div class="form-group">

                <label for="cgpa">
                    CGPA
                </label>

                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="Enter CGPA (0 - 10)"
                    inputmode="decimal"
                    required>

            </div>


            <!-- RESUME -->

            <div class="form-group">

                <label for="resume">
                    Resume (PDF)
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,application/pdf"
                    required>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Register

            </button>

        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- LOGIN -->

        <div class="login-link">

            <p>

                Already have an account?

                <a href="/login.html">
                    Login Here
                </a>

            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // ==========================================
        // SHOW / HIDE PASSWORD
        // ==========================================

        function togglePassword(fieldId, button) {

            const field =
                document.getElementById(fieldId);

            if (field.type === "password") {

                field.type = "text";

                button.textContent = "🙈";

            } else {

                field.type = "password";

                button.textContent = "👁";

            }
        }


        // ==========================================
        // URL PARAMETERS
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const success =
            urlParams.get("success");

        const existing =
            urlParams.get("existing");


        // ==========================================
        // IMMEDIATE REDIRECT
        // ==========================================

        if (
            success === "true" ||
            existing === "true"
        ) {

            window.location.replace("/login.html");

        }


        // ==========================================
        // REGISTRATION VALIDATION
        // ==========================================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                function(event) {

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const phone =
                        document
                            .getElementById("phone")
                            .value
                            .trim();

                    const branch =
                        document
                            .getElementById("branch")
                            .value;

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;

                    const cgpa =
                        parseFloat(
                            document
                                .getElementById("cgpa")
                                .value
                        );

                    const resume =
                        document
                            .getElementById("resume")
                            .files[0];

                    const message =
                        document.getElementById(
                            "message"
                        );

                    const registerBtn =
                        document.getElementById(
                            "registerBtn"
                        );


                    // ==================================
                    // VALIDATION
                    // ==================================

                    if (!name) {

                        event.preventDefault();

                        message.textContent =
                            "Please enter your name.";

                        return;
                    }


                    if (!email) {

                        event.preventDefault();

                        message.textContent =
                            "Please enter your email.";

                        return;
                    }


                    if (!/^[0-9]{10}$/.test(phone)) {

                        event.preventDefault();

                        message.textContent =
                            "Phone number must contain exactly 10 digits.";

                        return;
                    }


                    if (!branch) {

                        event.preventDefault();

                        message.textContent =
                            "Please select your branch.";

                        return;
                    }


                    if (password.length < 6) {

                        event.preventDefault();

                        message.textContent =
                            "Password must contain at least 6 characters.";

                        return;
                    }


                    if (password !== confirmPassword) {

                        event.preventDefault();

                        message.textContent =
                            "Passwords do not match.";

                        return;
                    }


                    if (
                        isNaN(cgpa) ||
                        cgpa < 0 ||
                        cgpa > 10
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "CGPA must be between 0 and 10.";

                        return;
                    }


                    if (!resume) {

                        event.preventDefault();

                        message.textContent =
                            "Please select your resume.";

                        return;
                    }


                    if (
                        !resume.name
                            .toLowerCase()
                            .endsWith(".pdf")
                    ) {

                        event.preventDefault();

                        message.textContent =
                            "Only PDF resume is allowed.";

                        return;
                    }


                    // ==================================
                    // NORMAL FORM SUBMISSION
                    //
                    // IMPORTANT:
                    // DO NOT CHANGE THIS TO FETCH()
                    // because normal multipart submission
                    // is working with mobile PDF upload.
                    // ==================================

                    registerBtn.disabled = true;

                    registerBtn.textContent =
                        "Registering...";

                    message.textContent =
                        "Uploading resume and registering...";

                    message.style.color =
                        "#2563eb";
                }
            );

    </script>

</body>

</html>
