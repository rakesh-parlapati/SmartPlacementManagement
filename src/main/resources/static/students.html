<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Manage Students | SPMS Admin</title>

<!-- COMMON AUTHENTICATION + GLOBAL DARK MODE -->
<script src="/JS/auth.js"></script>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f8;
        color: #333;
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* ==============================
       NAVBAR
    ============================== */

    nav {
        background: #1f3c88;
        color: white;

        padding: 18px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 15px;
    }

    nav h2 {
        font-size: 24px;
    }

    .nav-actions {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    nav button {
        border: none;
        padding: 9px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .theme-btn {
        background: white;
        color: #1f3c88;
    }

    .logout-btn {
        background: #dc3545;
        color: white;
    }

    nav button:hover {
        opacity: 0.9;
    }

    /* ==============================
       CONTAINER
    ============================== */

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 30px auto;
    }

    /* ==============================
       TOP SECTION
    ============================== */

    .top-section {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 15px;
        margin-bottom: 25px;
    }

    .top-section h1 {
        color: #1f3c88;
    }

    .back-btn {
        background: #1f3c88;
        color: white;

        border: none;
        padding: 11px 18px;

        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .back-btn:hover {
        opacity: 0.9;
    }

    /* ==============================
       SEARCH
    ============================== */

    .search-box {
        margin-bottom: 25px;
    }

    .search-box input {
        width: 100%;

        padding: 13px;

        border: 1px solid #ccc;
        border-radius: 7px;

        font-size: 15px;
        outline: none;

        background: white;
        color: #333;
    }

    .search-box input:focus {
        border-color: #1f3c88;
    }

    /* ==============================
       STUDENT CARD
    ============================== */

    .student-card {
        background: white;

        border-radius: 12px;

        padding: 22px;
        margin-bottom: 20px;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.08);

        transition:
            background 0.3s ease,
            box-shadow 0.3s ease;
    }

    .student-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 15px;

        border-bottom: 1px solid #ddd;

        padding-bottom: 13px;
        margin-bottom: 18px;
    }

    .student-header h2 {
        color: #1f3c88;
        word-break: break-word;
    }

    .student-id {
        background: #eef2ff;
        color: #1f3c88;

        padding: 7px 12px;

        border-radius: 15px;

        font-size: 13px;
        font-weight: bold;

        white-space: nowrap;
    }

    /* ==============================
       DETAILS
    ============================== */

    .details {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 14px;
    }

    .detail {
        background: #f8f9fa;

        padding: 13px;

        border-radius: 7px;

        word-break: break-word;
    }

    .detail strong {
        display: block;

        color: #555;

        margin-bottom: 5px;

        font-size: 14px;
    }

    /* ==============================
       ACTIONS
    ============================== */

    .actions {
        display: flex;

        flex-wrap: wrap;

        gap: 10px;

        margin-top: 20px;
    }

    .actions button,
    .actions a {
        border: none;

        padding: 10px 15px;

        border-radius: 6px;

        cursor: pointer;

        text-decoration: none;

        font-size: 14px;

        font-weight: bold;

        text-align: center;
    }

    .view-btn {
        background: #1f3c88;
        color: white;
    }

    .edit-btn {
        background: #f0ad4e;
        color: white;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    .resume-btn {
        background: #6f42c1;
        color: white;
    }

    .actions button:hover,
    .actions a:hover {
        opacity: 0.9;
    }

    /* ==============================
       MESSAGE
    ============================== */

    .message {
        background: white;

        padding: 35px;

        border-radius: 10px;

        text-align: center;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .message h2 {
        color: #1f3c88;

        margin-bottom: 10px;
    }

    .message p {
        color: #666;

        line-height: 1.6;
    }

    /* ==============================
       ERROR
    ============================== */

    .error {
        text-align: center;

        color: #b00020;

        margin: 20px 0;

        font-weight: bold;
    }

    /* ==============================
       LOADING
    ============================== */

    .loading {
        text-align: center;

        color: #666;

        margin: 30px;

        font-size: 16px;
    }

    /* ==============================
       DARK MODE
    ============================== */

    body.dark-mode {
        background: #121212;
        color: #eeeeee;
    }

    body.dark-mode .student-card,
    body.dark-mode .message {
        background: #1e1e1e;
        color: #eeeeee;
    }

    body.dark-mode .student-header {
        border-bottom-color: #444;
    }

    body.dark-mode .student-header h2,
    body.dark-mode .message h2,
    body.dark-mode .top-section h1 {
        color: #8fb3ff;
    }

    body.dark-mode .detail {
        background: #2a2a2a;
    }

    body.dark-mode .detail strong {
        color: #bbbbbb;
    }

    body.dark-mode .student-id {
        background: #27345f;
        color: #b8c9ff;
    }

    body.dark-mode .search-box input {
        background: #1e1e1e;
        color: #ffffff;
        border-color: #555;
    }

    body.dark-mode .search-box input::placeholder {
        color: #aaa;
    }

    body.dark-mode .loading {
        color: #bbb;
    }

    body.dark-mode .message p {
        color: #bbb;
    }

    body.dark-mode .theme-btn {
        background: #f8f9fa;
        color: #212529;
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 900px) {

        .details {
            grid-template-columns:
                repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {

        nav {
            padding: 15px 20px;

            flex-direction: column;

            align-items: flex-start;
        }

        nav h2 {
            font-size: 20px;
        }

        .nav-actions {
            width: 100%;

            flex-wrap: wrap;
        }

        .container {
            width: 94%;
        }

        .top-section {
            flex-direction: column;

            align-items: flex-start;
        }

        .details {
            grid-template-columns: 1fr;
        }

        .student-header {
            flex-direction: column;

            align-items: flex-start;
        }

        .actions {
            flex-direction: column;
        }

        .actions button,
        .actions a {
            width: 100%;
        }

        .back-btn {
            width: 100%;
        }
    }

</style>


</head>

<body>


<!-- ==============================
     NAVBAR
============================== -->

<nav>

    <h2>
        SPMS Admin
    </h2>

    <div class="nav-actions">

        <button
            type="button"
            class="theme-btn"
            onclick="toggleDarkMode()">

            🌙 Dark Mode

        </button>

        <button
            type="button"
            class="logout-btn"
            onclick="logoutUser()">

            Logout

        </button>

    </div>

</nav>


<!-- ==============================
     MAIN CONTAINER
============================== -->

<div class="container">

    <div class="top-section">

        <h1>
            Manage Students
        </h1>

        <button
            type="button"
            class="back-btn"
            onclick="goToDashboard()">

            Admin Dashboard

        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, email, phone, branch or student ID..."
            autocomplete="off">

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        Loading students...

    </div>


    <!-- STUDENTS -->

    <div id="studentsContainer"></div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error">

    </div>

</div>


<script>

    // ==========================================
    // STORE STUDENTS
    // ==========================================

    let allStudents = [];


    // ==========================================
    // PAGE INITIALIZATION
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (
                typeof requireAdmin !==
                "function"
            ) {

                document.getElementById(
                    "loading"
                ).style.display = "none";

                document.getElementById(
                    "errorMessage"
                ).textContent =
                    "Authentication system not found.";

                return;
            }


            if (!requireAdmin()) {
                return;
            }


            loadStudents();
        }
    );


    // ==========================================
    // SEARCH EVENT
    // ==========================================

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            filterStudents
        );


    // ==========================================
    // LOAD STUDENTS
    // ==========================================

    async function loadStudents() {

        const loading =
            document.getElementById(
                "loading"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const container =
            document.getElementById(
                "studentsContainer"
            );


        loading.style.display =
            "block";

        loading.textContent =
            "Loading students...";

        errorMessage.textContent =
            "";

        container.innerHTML =
            "";


        try {

            const response =
                await fetch(
                    "/students",
                    {
                        method: "GET",

                        headers: {
                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "same-origin"
                    }
                );


            if (!response.ok) {

                if (
                    response.status ===
                    401
                ) {

                    window.location.href =
                        "/login.html";

                    return;
                }


                if (
                    response.status ===
                    403
                ) {

                    throw new Error(
                        "Administrator access is required."
                    );
                }


                throw new Error(
                    "Unable to load students. HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            if (!Array.isArray(data)) {

                throw new Error(
                    "Invalid students response from server."
                );
            }


            allStudents =
                data;


            // Newest/highest ID first
            allStudents.sort(
                function (a, b) {

                    return (
                        Number(b.id || 0) -
                        Number(a.id || 0)
                    );
                }
            );


            loading.style.display =
                "none";


            displayStudents(
                allStudents
            );

        } catch (error) {

            console.error(
                "Error loading students:",
                error
            );


            loading.style.display =
                "none";


            errorMessage.textContent =
                error.message ||
                "Unable to load students.";


            container.innerHTML = `

                <div class="message">

                    <h2>
                        Unable to Load Students
                    </h2>

                    <p>
                        Please make sure Spring Boot
                        is running and try again.
                    </p>

                </div>

            `;
        }
    }


    // ==========================================
    // DISPLAY STUDENTS
    // ==========================================

    function displayStudents(
        students
    ) {

        const container =
            document.getElementById(
                "studentsContainer"
            );


        container.innerHTML =
            "";


        // ======================================
        // EMPTY STATE
        // ======================================

        if (
            !students ||
            students.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    <h2>
                        No Students Found
                    </h2>

                    <p>
                        No students match your search.
                    </p>

                </div>

            `;

            return;
        }


        // ======================================
        // CREATE CARDS
        // ======================================

        students.forEach(
            function (student) {

                const studentId =
                    student.id !== null &&
                    student.id !== undefined
                        ? String(student.id)
                        : "";


                // ==================================
                // RESUME
                // ==================================

                const hasResume =
                    student.resume &&
                    String(student.resume)
                        .trim() !== "" &&
                    String(student.resume)
                        .toLowerCase() !==
                        "null";


                const resumeButton =
                    hasResume
                        ? `

                            <a
                                class="resume-btn"
                                href="/students/${encodeURIComponent(studentId)}/resume"
                                target="_blank"
                                rel="noopener noreferrer">

                                View Resume

                            </a>

                          `
                        : "";


                // ==================================
                // CGPA
                // ==================================

                let cgpa = "-";


                if (
                    student.cgpa !== null &&
                    student.cgpa !== undefined &&
                    student.cgpa !== ""
                ) {

                    const cgpaNumber =
                        Number(
                            student.cgpa
                        );


                    if (
                        Number.isFinite(
                            cgpaNumber
                        )
                    ) {

                        cgpa =
                            cgpaNumber.toFixed(2);

                    } else {

                        cgpa =
                            escapeHTML(
                                student.cgpa
                            );
                    }
                }


                // ==================================
                // PERCENTAGE
                // ==================================

                let percentage =
                    "-";


                if (
                    student.cgpa !== null &&
                    student.cgpa !== undefined &&
                    student.cgpa !== ""
                ) {

                    const cgpaNumber =
                        Number(
                            student.cgpa
                        );


                    if (
                        Number.isFinite(
                            cgpaNumber
                        )
                    ) {

                        percentage =
                            (
                                cgpaNumber * 10
                            ).toFixed(2) +
                            "%";
                    }
                }


                // ==================================
                // STUDENT CARD
                // ==================================

                container.innerHTML += `

                    <div class="student-card">

                        <div class="student-header">

                            <h2>
                                ${escapeHTML(
                                    student.name ||
                                    "-"
                                )}
                            </h2>

                            <span class="student-id">

                                ID:
                                ${escapeHTML(
                                    studentId
                                )}

                            </span>

                        </div>


                        <div class="details">


                            <div class="detail">

                                <strong>
                                    Student ID
                                </strong>

                                ${escapeHTML(
                                    studentId ||
                                    "-"
                                )}

                            </div>


                            <div class="detail">

                                <strong>
                                    Email
                                </strong>

                                ${escapeHTML(
                                    student.email ||
                                    "-"
                                )}

                            </div>


                            <div class="detail">

                                <strong>
                                    Phone Number
                                </strong>

                                ${escapeHTML(
                                    student.phone ||
                                    "Not Available"
                                )}

                            </div>


                            <div class="detail">

                                <strong>
                                    Branch
                                </strong>

                                ${escapeHTML(
                                    student.branch ||
                                    "Not Available"
                                )}

                            </div>


                            <div class="detail">

                                <strong>
                                    CGPA
                                </strong>

                                ${cgpa}

                            </div>


                            <div class="detail">

                                <strong>
                                    Percentage
                                </strong>

                                ${percentage}

                            </div>


                            <div class="detail">

                                <strong>
                                    Resume
                                </strong>

                                ${
                                    hasResume
                                        ? "Available"
                                        : "Not Available"
                                }

                            </div>

                        </div>


                        <div class="actions">


                            <button
                                type="button"
                                class="view-btn"
                                onclick="viewStudent('${escapeJS(studentId)}')">

                                View Details

                            </button>


                            <button
                                type="button"
                                class="edit-btn"
                                onclick="editStudent('${escapeJS(studentId)}')">

                                Edit Student

                            </button>


                            ${resumeButton}


                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteStudent('${escapeJS(studentId)}')">

                                Delete Student

                            </button>

                        </div>

                    </div>

                `;
            }
        );
    }


    // ==========================================
    // FILTER STUDENTS
    // ==========================================

    function filterStudents() {

        const search =
            document.getElementById(
                "searchInput"
            ).value
            .toLowerCase()
            .trim();


        const filtered =
            allStudents.filter(
                function (student) {

                    return (

                        String(
                            student.id || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            student.name || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            student.email || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            student.phone || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            student.branch || ""
                        )
                            .toLowerCase()
                            .includes(search)

                    );
                }
            );


        displayStudents(
            filtered
        );
    }


    // ==========================================
    // VIEW STUDENT
    // ==========================================

    function viewStudent(id) {

        if (!id) {
            return;
        }


        window.location.href =
            "/student-details.html?id=" +
            encodeURIComponent(id);
    }


    // ==========================================
    // EDIT STUDENT
    // ==========================================

    function editStudent(id) {

        if (!id) {
            return;
        }


        window.location.href =
            "/student-update.html?id=" +
            encodeURIComponent(id);
    }


    // ==========================================
    // DELETE STUDENT
    // ==========================================

    async function deleteStudent(
        id
    ) {

        if (!id) {

            alert(
                "Invalid student ID."
            );

            return;
        }


        const student =
            allStudents.find(
                function (item) {

                    return String(
                        item.id
                    ) === String(id);

                }
            );


        if (!student) {

            alert(
                "Student not found."
            );

            return;
        }


        const studentName =
            student.name ||
            "this student";


        const confirmed =
            confirm(
                "Are you sure you want to delete " +
                studentName +
                "?\n\n" +
                "This action cannot be undone."
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/students/" +
                    encodeURIComponent(id),
                    {
                        method: "DELETE",

                        credentials:
                            "same-origin"
                    }
                );


            if (
                response.status ===
                401
            ) {

                window.location.href =
                    "/login.html";

                return;
            }


            if (
                response.status ===
                403
            ) {

                alert(
                    "Administrator access is required."
                );

                return;
            }


            if (!response.ok) {

                let message =
                    "Unable to delete student.";


                try {

                    const text =
                        await response.text();

                    if (text) {
                        message = text;
                    }

                } catch (error) {

                    console.error(
                        error
                    );
                }


                throw new Error(
                    message
                );
            }


            alert(
                "Student deleted successfully."
            );


            await loadStudents();

        } catch (error) {

            console.error(
                "Delete student error:",
                error
            );


            alert(
                error.message ||
                "Unable to delete student."
            );
        }
    }


    // ==========================================
    // ADMIN DASHBOARD
    // ==========================================

    function goToDashboard() {

        window.location.href =
            "/admin.html";
    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(
        value
    ) {

        return String(
            value
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    // ==========================================
    // ESCAPE JAVASCRIPT STRING
    // ==========================================

    function escapeJS(
        value
    ) {

        return String(
            value
        )
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '\\"'
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                "\\r"
            );
    }

</script>


</body>

</html>
