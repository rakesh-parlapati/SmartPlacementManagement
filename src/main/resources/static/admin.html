
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | SPMS</title>

    <!-- COMMON ACCESS CONTROL + GLOBAL THEME -->
    <script src="/JS/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }

        /* ==============================
           NAVBAR
        ============================== */

        nav {
            background: #1f3c88;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        nav h2 {
            font-size: 24px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav button {
            border: none;
            padding: 9px 18px;
            border-radius: 6px;

            cursor: pointer;
            font-weight: bold;

            transition: 0.2s;
        }

        .theme-btn {
            background: #111827;
            color: white;
        }

        .logout-btn {
            background: white;
            color: #1f3c88;
        }

        nav button:hover {
            opacity: 0.85;
        }

        /* ==============================
           CONTAINER
        ============================== */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* ==============================
           WELCOME
        ============================== */

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        /* ==============================
           STATISTICS
        ============================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-bottom: 35px;
        }

        .stat-card {
            background: white;

            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            text-align: center;

            transition:
                background 0.3s,
                transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card h3 {
            color: #666;

            margin-bottom: 12px;
            font-size: 16px;
        }

        .stat-number {
            font-size: 35px;
            font-weight: bold;
            color: #1f3c88;
        }

        .pending {
            color: #856404;
        }

        .approved {
            color: #155724;
        }

        .rejected {
            color: #721c24;
        }

        /* ==============================
           QUICK ACTIONS
        ============================== */

        .quick-actions {
            background: white;

            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .quick-actions h2 {
            color: #1f3c88;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .action-btn {
            border: none;

            padding: 16px;
            border-radius: 8px;

            background: #1f3c88;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* ==============================
           REPORT BUTTON
        ============================== */

        .report-btn {
            background: #198754;
        }

        .report-btn:hover {
            background: #157347;
            opacity: 1;
        }

        /* ==============================
           ERROR
        ============================== */

        .error {
            text-align: center;

            color: #b00020;

            margin-top: 20px;

            font-weight: bold;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            text-align: center;

            color: #666;

            margin: 30px;
        }

        /* ==============================
           DARK MODE
        ============================== */

        body.dark-mode {
            background: #111827;
            color: #f3f4f6;
        }

        body.dark-mode .welcome h1 {
            color: #60a5fa;
        }

        body.dark-mode .welcome p {
            color: #d1d5db;
        }

        body.dark-mode .stat-card {
            background: #1f2937;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .stat-card h3 {
            color: #d1d5db;
        }

        body.dark-mode .stat-number {
            color: #60a5fa;
        }

        body.dark-mode .pending {
            color: #facc15;
        }

        body.dark-mode .approved {
            color: #4ade80;
        }

        body.dark-mode .rejected {
            color: #f87171;
        }

        body.dark-mode .quick-actions {
            background: #1f2937;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .quick-actions h2 {
            color: #60a5fa;
        }

        body.dark-mode .theme-btn {
            background: #f3f4f6;
            color: #111827;
        }

        body.dark-mode .loading {
            color: #d1d5db;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {

            nav {
                padding: 15px 20px;

                flex-direction: column;
                align-items: stretch;
            }

            nav h2 {
                font-size: 20px;
                text-align: center;
            }

            .nav-buttons {
                justify-content: center;
            }

            nav button {
                flex: 1;
            }

            .container {
                width: 94%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav>

        <h2>
            SPMS Admin
        </h2>

        <div class="nav-buttons">

            <button
                type="button"
                class="theme-btn"
                onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button
                type="button"
                class="logout-btn"
                onclick="logoutUser()">
                Logout
            </button>

        </div>

    </nav>


    <!-- ==============================
         MAIN CONTAINER
    ============================== -->

    <div class="container">

        <!-- WELCOME -->

        <div class="welcome">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage students, companies and placement applications.
            </p>

        </div>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading">

            Loading dashboard...

        </div>


        <!-- ==============================
             STATISTICS
        ============================== -->

        <div
            class="stats"
            id="stats"
            style="display: none;">

            <!-- TOTAL STUDENTS -->

            <div class="stat-card">

                <h3>
                    Total Students
                </h3>

                <div
                    class="stat-number"
                    id="studentCount">

                    0

                </div>

            </div>


            <!-- TOTAL COMPANIES -->

            <div class="stat-card">

                <h3>
                    Total Companies
                </h3>

                <div
                    class="stat-number"
                    id="companyCount">

                    0

                </div>

            </div>


            <!-- TOTAL APPLICATIONS -->

            <div class="stat-card">

                <h3>
                    Total Applications
                </h3>

                <div
                    class="stat-number"
                    id="applicationCount">

                    0

                </div>

            </div>


            <!-- PENDING -->

            <div class="stat-card">

                <h3>
                    Pending Applications
                </h3>

                <div
                    class="stat-number pending"
                    id="pendingCount">

                    0

                </div>

            </div>


            <!-- APPROVED -->

            <div class="stat-card">

                <h3>
                    Approved Applications
                </h3>

                <div
                    class="stat-number approved"
                    id="approvedCount">

                    0

                </div>

            </div>


            <!-- REJECTED -->

            <div class="stat-card">

                <h3>
                    Rejected Applications
                </h3>

                <div
                    class="stat-number rejected"
                    id="rejectedCount">

                    0

                </div>

            </div>

        </div>


        <!-- ==============================
             QUICK ACTIONS
        ============================== -->

        <div class="quick-actions">

            <h2>
                Quick Actions
            </h2>

            <div class="buttons">

                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/students.html')">

                    Manage Students

                </button>


                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/companies.html')">

                    View Companies

                </button>


                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/company-add.html')">

                    Add Company

                </button>


                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/applications.html')">

                    View Applications

                </button>


                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/student-details.html')">

                    Student Details

                </button>


                <button
                    type="button"
                    class="action-btn report-btn"
                    onclick="openPage('/placement-report.html')">

                    Placement Report

                </button>


                <button
                    type="button"
                    class="action-btn"
                    onclick="openPage('/index.html')">

                    Home

                </button>

            </div>

        </div>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error">
        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        // ==========================================
        // ADMIN ACCESS PROTECTION
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                try {

                    if (typeof requireAdmin === "function") {

                        if (!requireAdmin()) {
                            return;
                        }

                    } else {

                        console.error(
                            "requireAdmin() not found in /JS/auth.js"
                        );

                        document.getElementById(
                            "loading"
                        ).style.display = "none";

                        document.getElementById(
                            "errorMessage"
                        ).textContent =
                            "Authentication system is unavailable.";

                        return;
                    }

                } catch (error) {

                    console.error(
                        "Admin authentication error:",
                        error
                    );

                    document.getElementById(
                        "loading"
                    ).style.display = "none";

                    document.getElementById(
                        "errorMessage"
                    ).textContent =
                        "Authentication error. Please check auth.js.";

                    return;
                }


                // LOAD DASHBOARD DATA

                loadDashboard();

            }
        );


        // ==========================================
        // SAFE FETCH FUNCTION
        // ==========================================

        async function fetchData(url) {

            try {

                const response =
                    await fetch(
                        url,
                        {
                            credentials: "same-origin"
                        }
                    );


                if (!response.ok) {

                    console.error(
                        url +
                        " returned HTTP " +
                        response.status
                    );

                    return [];
                }


                const data =
                    await response.json();


                if (Array.isArray(data)) {
                    return data;
                }


                console.warn(
                    url +
                    " did not return an array"
                );

                return [];

            } catch (error) {

                console.error(
                    "Error loading " + url,
                    error
                );

                return [];
            }
        }


        // ==========================================
        // LOAD DASHBOARD
        // ==========================================

        async function loadDashboard() {

            const loading =
                document.getElementById("loading");

            const stats =
                document.getElementById("stats");

            const errorMessage =
                document.getElementById("errorMessage");


            try {

                loading.style.display = "block";
                errorMessage.textContent = "";


                // LOAD DATA FROM SPRING BOOT APIs

                const students =
                    await fetchData("/students");

                const companies =
                    await fetchData("/companies");

                const applications =
                    await fetchData("/applications");


                // APPLICATION STATUS COUNTS

                let pending = 0;
                let approved = 0;
                let rejected = 0;


                applications.forEach(
                    function(app) {

                        const status =
                            String(
                                app.status || "Pending"
                            )
                            .trim()
                            .toLowerCase();


                        if (status === "pending") {

                            pending++;

                        } else if (
                            status === "approved"
                        ) {

                            approved++;

                        } else if (
                            status === "rejected"
                        ) {

                            rejected++;
                        }

                    }
                );


                // UPDATE DASHBOARD COUNTS

                document.getElementById(
                    "studentCount"
                ).textContent =
                    students.length;


                document.getElementById(
                    "companyCount"
                ).textContent =
                    companies.length;


                document.getElementById(
                    "applicationCount"
                ).textContent =
                    applications.length;


                document.getElementById(
                    "pendingCount"
                ).textContent =
                    pending;


                document.getElementById(
                    "approvedCount"
                ).textContent =
                    approved;


                document.getElementById(
                    "rejectedCount"
                ).textContent =
                    rejected;


                // HIDE LOADING

                loading.style.display = "none";


                // SHOW DASHBOARD

                stats.style.display = "grid";


                // API CHECK

                if (
                    students.length === 0 &&
                    companies.length === 0 &&
                    applications.length === 0
                ) {

                    errorMessage.textContent =
                        "No dashboard data found. Please check your Spring Boot APIs.";

                } else {

                    errorMessage.textContent = "";
                }


            } catch (error) {

                console.error(
                    "Dashboard error:",
                    error
                );

                loading.style.display = "none";

                stats.style.display = "grid";

                errorMessage.textContent =
                    "Some dashboard data could not be loaded. Please check Spring Boot.";
            }
        }


        // ==========================================
        // OPEN PAGE
        // ==========================================

        function openPage(page) {
            window.location.href = page;
        }

    </script>

</body>

</html>
