
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Company | SPMS</title>

    <!-- COMMON ACCESS CONTROL + GLOBAL THEME -->
    <script src="/JS/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        nav {
            background: #1e3a8a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        nav h2 {
            font-size: 24px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        nav button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-btn {
            background: #374151;
            color: white;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
        }

        nav button:hover {
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: background 0.3s, color 0.3s;
        }

        .card h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background: white;
            color: #333;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #1e3a8a;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .help-text {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .buttons button,
        .buttons a {
            border: none;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }

        .save-btn {
            background: #16a34a;
            color: white;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .clear-btn {
            background: #f59e0b;
            color: white;
        }

        .clear-btn:hover {
            background: #d97706;
        }

        .back-btn {
            background: #64748b;
            color: white;
        }

        .back-btn:hover {
            background: #475569;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            min-height: 22px;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            text-align: center;
            color: #555;
            margin: 20px 0;
        }

        /* ==========================
           DARK MODE
           ========================== */

        body.dark-mode {
            background: #111827;
            color: #f3f4f6;
        }

        body.dark-mode nav {
            background: #020617;
        }

        body.dark-mode .card {
            background: #1f2937;
            color: #f3f4f6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        }

        body.dark-mode .card h1 {
            color: #60a5fa;
        }

        body.dark-mode .subtitle {
            color: #d1d5db;
        }

        body.dark-mode label {
            color: #f3f4f6;
        }

        body.dark-mode input,
        body.dark-mode textarea {
            background: #111827;
            color: #f3f4f6;
            border-color: #4b5563;
        }

        body.dark-mode input:focus,
        body.dark-mode textarea:focus {
            border-color: #60a5fa;
        }

        body.dark-mode .help-text {
            color: #9ca3af;
        }

        body.dark-mode .loading {
            color: #d1d5db;
        }

        body.dark-mode .theme-btn {
            background: #e5e7eb;
            color: #111827;
        }

        body.dark-mode .success {
            color: #4ade80;
        }

        body.dark-mode .error {
            color: #f87171;
        }

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
            }

            nav h2 {
                font-size: 19px;
                text-align: center;
            }

            .nav-buttons {
                justify-content: center;
            }

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons button,
            .buttons a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav>

        <h2>Smart Placement Management System</h2>

        <div class="nav-buttons">

            <button
                class="theme-btn"
                type="button"
                onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button
                class="logout-btn"
                type="button"
                onclick="logoutUser()">
                Logout
            </button>

        </div>

    </nav>

    <div class="container">

        <div class="card">

            <h1>Edit Company</h1>

            <p class="subtitle">
                Update company and job information
            </p>

            <p
                id="loading"
                class="loading">
                Loading company details...
            </p>

            <form
                id="companyForm"
                style="display: none;">

                <div class="form-grid">

                    <!-- COMPANY NAME -->
                    <div class="form-group">

                        <label for="companyName">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            required>

                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Company Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            required>

                    </div>

                    <!-- LOCATION -->
                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            required>

                    </div>

                    <!-- JOB ROLE -->
                    <div class="form-group">

                        <label for="jobRole">
                            Job Role
                        </label>

                        <input
                            type="text"
                            id="jobRole"
                            required>

                    </div>

                    <!-- PACKAGE -->
                    <div class="form-group">

                        <label for="packageAmount">
                            Package / LPA
                        </label>

                        <input
                            type="number"
                            id="packageAmount"
                            min="0"
                            step="0.1"
                            required>

                        <span class="help-text">
                            Enter package in LPA.
                        </span>

                    </div>

                    <!-- ELIGIBILITY -->
                    <div class="form-group">

                        <label for="eligibility">
                            Eligibility
                        </label>

                        <input
                            type="text"
                            id="eligibility"
                            placeholder="Example: 60%"
                            required>

                        <span class="help-text">
                            Enter the minimum percentage required.
                        </span>

                    </div>

                    <!-- DESCRIPTION -->
                    <div class="form-group full">

                        <label for="description">
                            Job Description
                        </label>

                        <textarea
                            id="description"
                            required></textarea>

                    </div>

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn">
                        Update Company
                    </button>

                    <button
                        type="button"
                        class="clear-btn"
                        onclick="resetForm()">
                        Reset
                    </button>

                    <a
                        href="/companies.html"
                        class="back-btn">
                        Back to Companies
                    </a>

                </div>

            </form>

            <div id="message"></div>

        </div>

    </div>

    <script>

        // ==========================================
        // ADMIN ACCESS CHECK
        // ==========================================

        if (!requireAdmin()) {
            // requireAdmin() redirects automatically
        }

        // ==========================================
        // GET COMPANY ID FROM URL
        // ==========================================

        const urlParams =
            new URLSearchParams(window.location.search);

        const companyId =
            urlParams.get("id");

        // ==========================================
        // CHECK COMPANY ID
        // ==========================================

        if (!companyId) {

            alert("Company ID is missing.");

            window.location.href =
                "/companies.html";

        }

        let originalCompany = null;

        // ==========================================
        // LOAD COMPANY
        // ==========================================

        async function loadCompany() {

            try {

                const response =
                    await fetch(
                        "/companies/" +
                        encodeURIComponent(companyId),
                        {
                            method: "GET",
                            credentials: "same-origin"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "Company not found."
                    );
                }

                const company =
                    await response.json();

                originalCompany =
                    company;

                // Fill form

                document.getElementById("companyName")
                    .value =
                    company.companyName || "";

                document.getElementById("email")
                    .value =
                    company.email || "";

                document.getElementById("location")
                    .value =
                    company.location || "";

                document.getElementById("jobRole")
                    .value =
                    company.jobRole || "";

                document.getElementById("packageAmount")
                    .value =
                    company.packageAmount ?? "";

                document.getElementById("eligibility")
                    .value =
                    company.eligibility || "";

                document.getElementById("description")
                    .value =
                    company.description || "";

                document.getElementById("loading")
                    .style.display =
                    "none";

                document.getElementById("companyForm")
                    .style.display =
                    "block";

            } catch (error) {

                console.error(
                    "Company loading error:",
                    error
                );

                document.getElementById("loading")
                    .textContent =
                    "Unable to load company details.";

                document.getElementById("loading")
                    .style.color =
                    "#dc2626";
            }
        }

        // ==========================================
        // RESET FORM
        // ==========================================

        function resetForm() {

            if (!originalCompany) {
                return;
            }

            document.getElementById("companyName")
                .value =
                originalCompany.companyName || "";

            document.getElementById("email")
                .value =
                originalCompany.email || "";

            document.getElementById("location")
                .value =
                originalCompany.location || "";

            document.getElementById("jobRole")
                .value =
                originalCompany.jobRole || "";

            document.getElementById("packageAmount")
                .value =
                originalCompany.packageAmount ?? "";

            document.getElementById("eligibility")
                .value =
                originalCompany.eligibility || "";

            document.getElementById("description")
                .value =
                originalCompany.description || "";

            const message =
                document.getElementById("message");

            message.textContent = "";
            message.className = "";
        }

        // ==========================================
        // UPDATE COMPANY
        // ==========================================

        document
            .getElementById("companyForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const message =
                        document.getElementById(
                            "message"
                        );

                    message.textContent =
                        "Updating company...";

                    message.className = "";

                    // Get values

                    const companyName =
                        document
                            .getElementById("companyName")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const location =
                        document
                            .getElementById("location")
                            .value
                            .trim();

                    const jobRole =
                        document
                            .getElementById("jobRole")
                            .value
                            .trim();

                    const packageAmount =
                        document
                            .getElementById("packageAmount")
                            .value;

                    const eligibility =
                        document
                            .getElementById("eligibility")
                            .value
                            .trim();

                    const description =
                        document
                            .getElementById("description")
                            .value
                            .trim();

                    // ==================================
                    // BASIC VALIDATION
                    // ==================================

                    if (
                        !companyName ||
                        !email ||
                        !location ||
                        !jobRole ||
                        !packageAmount ||
                        !eligibility ||
                        !description
                    ) {

                        message.textContent =
                            "Please fill all fields.";

                        message.className =
                            "error";

                        return;
                    }

                    // ==================================
                    // PACKAGE VALIDATION
                    // ==================================

                    const packageNumber =
                        Number(packageAmount);

                    if (
                        !Number.isFinite(packageNumber) ||
                        packageNumber <= 0
                    ) {

                        message.textContent =
                            "Package must be greater than 0.";

                        message.className =
                            "error";

                        return;
                    }

                    // ==================================
                    // ELIGIBILITY VALIDATION
                    // ==================================

                    const eligibilityNumber =
                        parseFloat(
                            eligibility.replace(
                                /[^0-9.]/g,
                                ""
                            )
                        );

                    if (
                        isNaN(eligibilityNumber) ||
                        eligibilityNumber < 0 ||
                        eligibilityNumber > 100
                    ) {

                        message.textContent =
                            "Eligibility must be between 0% and 100%.";

                        message.className =
                            "error";

                        return;
                    }

                    // ==================================
                    // COMPANY DATA
                    // ==================================

                    const companyData = {

                        companyName:
                            companyName,

                        email:
                            email,

                        location:
                            location,

                        jobRole:
                            jobRole,

                        packageAmount:
                            packageNumber,

                        eligibility:
                            eligibility,

                        description:
                            description
                    };

                    // ==================================
                    // SEND UPDATE REQUEST
                    // ==================================

                    try {

                        const response =
                            await fetch(
                                "/companies/" +
                                encodeURIComponent(companyId),
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials:
                                        "same-origin",

                                    body:
                                        JSON.stringify(
                                            companyData
                                        )
                                }
                            );

                        if (!response.ok) {

                            let errorMessage =
                                "Unable to update company.";

                            try {

                                const errorText =
                                    await response.text();

                                if (errorText) {
                                    errorMessage =
                                        errorText;
                                }

                            } catch (e) {
                                // Ignore response parsing error
                            }

                            throw new Error(
                                errorMessage
                            );
                        }

                        await response.json();

                        message.textContent =
                            "Company updated successfully!";

                        message.className =
                            "success";

                        // Redirect after success

                        setTimeout(function() {

                            window.location.href =
                                "/company-details.html?id=" +
                                encodeURIComponent(companyId);

                        }, 1000);

                    } catch (error) {

                        console.error(
                            "Update company error:",
                            error
                        );

                        message.textContent =
                            "Failed to update company. Please try again.";

                        message.className =
                            "error";
                    }
                }
            );

        // ==========================================
        // START
        // ==========================================

        if (companyId) {
            loadCompany();
        }

    </script>

</body>

</html>
