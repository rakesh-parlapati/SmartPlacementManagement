
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | SPMS</title>

    <!-- COMMON ACCESS CONTROL -->
    <script src="/JS/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #333;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #1d4ed8;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions button {
            border: none;
            background: white;
            color: #1d4ed8;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .header-actions button:hover {
            background: #e5e7eb;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           TITLE
        ========================= */

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
            color: #222;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .form-group input:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .help-text {
            margin-top: 6px;
            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           CURRENT RESUME
        ========================= */

        .current-resume {
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .current-resume a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .current-resume a:hover {
            text-decoration: underline;
        }

        /* =========================
           BUTTONS
        ========================= */

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .update-btn,
        .back-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .update-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .update-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .back-btn:hover {
            background: #cbd5e1;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            min-height: 20px;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .card {
            background: #1e1e1e;
            color: #e0e0e0;
        }

        body.dark-mode .title h1 {
            color: #8ab4f8;
        }

        body.dark-mode .title p {
            color: #aaa;
        }

        body.dark-mode .form-group label {
            color: #ddd;
        }

        body.dark-mode .form-group input {
            background: #2a2a2a;
            color: #eee;
            border-color: #555;
        }

        body.dark-mode .form-group input:focus {
            border-color: #8ab4f8;
        }

        body.dark-mode .form-group input:disabled {
            background: #252525;
            color: #999;
        }

        body.dark-mode .help-text,
        body.dark-mode .current-resume {
            color: #aaa;
        }

        body.dark-mode .current-resume a {
            color: #8ab4f8;
        }

        body.dark-mode .back-btn {
            background: #374151;
            color: #eee;
        }

        body.dark-mode .back-btn:hover {
            background: #4b5563;
        }

        body.dark-mode .header-actions button {
            background: #2a2a2a;
            color: #8ab4f8;
        }

        body.dark-mode .header-actions button:hover {
            background: #3a3a3a;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions button {
                padding: 8px 12px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .button-container {
                flex-direction: column;
            }

            .update-btn,
            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="logo">
            SPMS
        </div>

        <div class="header-actions">

            <button
                type="button"
                class="theme-btn"
                onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button
                type="button"
                onclick="logoutUser()">
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         EDIT PROFILE
    ========================= -->

    <div class="container">

        <div class="card">

            <div class="title">

                <h1>
                    Edit Profile
                </h1>

                <p>
                    Update your student information
                </p>

            </div>


            <form id="editStudentForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                        maxlength="100">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        maxlength="100">

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        minlength="6"
                        placeholder="Leave blank to keep current password">

                    <div class="help-text">
                        Leave this field blank if you do not want to change your password.
                    </div>

                </div>


                <!-- CGPA -->

                <div class="form-group">

                    <label for="cgpa">
                        CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpa"
                        step="0.01"
                        min="0"
                        max="10"
                        required>

                </div>


                <!-- RESUME -->

                <div class="form-group">

                    <label for="resume">
                        Replace Resume (PDF only)
                    </label>

                    <input
                        type="file"
                        id="resume"
                        accept="application/pdf,.pdf">

                    <div
                        class="current-resume"
                        id="currentResume">
                        Current resume: Loading...
                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="button-container">

                    <button
                        type="submit"
                        class="update-btn"
                        id="updateButton">

                        Update Profile

                    </button>

                    <a
                        href="/profile.html"
                        class="back-btn">

                        Back to Profile

                    </a>

                </div>

            </form>


            <p id="message"></p>

        </div>

    </div>


    <script>

        // ==========================================
        // PAGE INITIALIZATION
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (!requireStudent()) {
                    return;
                }

                const studentId =
                    getStudentId();

                if (!studentId) {
                    return;
                }

                loadStudent(studentId);
            }
        );


        // ==========================================
        // LOAD STUDENT
        // ==========================================

        async function loadStudent(studentId) {

            try {

                const response =
                    await fetch(
                        `/students/${encodeURIComponent(studentId)}`,
                        {
                            method: "GET",
                            credentials: "same-origin"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Student not found"
                    );
                }


                const student =
                    await response.json();


                // NAME

                document.getElementById(
                    "name"
                ).value =
                    student.name || "";


                // EMAIL

                document.getElementById(
                    "email"
                ).value =
                    student.email || "";


                // CGPA

                document.getElementById(
                    "cgpa"
                ).value =
                    student.cgpa !== null &&
                    student.cgpa !== undefined
                        ? student.cgpa
                        : "";


                // PASSWORD

                // Password is intentionally NOT loaded.
                // Student.password is hidden by @JsonIgnore.

                document.getElementById(
                    "password"
                ).value = "";


                // CURRENT RESUME

                if (student.resume) {

                    document.getElementById(
                        "currentResume"
                    ).innerHTML =

                        `Current resume:
                        <a
                            href="/students/${encodeURIComponent(student.id)}/resume"
                            target="_blank"
                            rel="noopener noreferrer">
                            View Resume
                        </a>`;

                } else {

                    document.getElementById(
                        "currentResume"
                    ).textContent =
                        "No resume uploaded";
                }

            } catch (error) {

                console.error(
                    "Error loading student:",
                    error
                );

                showMessage(
                    "Unable to load student information.",
                    false
                );
            }
        }


        // ==========================================
        // UPDATE PROFILE
        // ==========================================

        document.getElementById(
            "editStudentForm"
        ).addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const studentId =
                    getStudentId();


                if (!studentId) {

                    alert(
                        "Student login is required."
                    );

                    window.location.href =
                        "/login.html";

                    return;
                }


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value.trim();


                const cgpa =
                    document.getElementById(
                        "cgpa"
                    ).value;


                const resume =
                    document.getElementById(
                        "resume"
                    ).files[0];


                // ==================================
                // VALIDATION
                // ==================================

                if (!name) {

                    showMessage(
                        "Student name is required.",
                        false
                    );

                    return;
                }


                if (!email) {

                    showMessage(
                        "Email address is required.",
                        false
                    );

                    return;
                }


                if (cgpa === "") {

                    showMessage(
                        "CGPA is required.",
                        false
                    );

                    return;
                }


                const cgpaNumber =
                    Number(cgpa);


                if (
                    !Number.isFinite(cgpaNumber) ||
                    cgpaNumber < 0 ||
                    cgpaNumber > 10
                ) {

                    showMessage(
                        "CGPA must be between 0 and 10.",
                        false
                    );

                    return;
                }


                // Password is optional.

                if (
                    password &&
                    password.length < 6
                ) {

                    showMessage(
                        "New password must contain at least 6 characters.",
                        false
                    );

                    return;
                }


                // Resume validation.

                if (resume) {

                    const isPdf =
                        resume.type ===
                        "application/pdf" ||
                        resume.name
                            .toLowerCase()
                            .endsWith(".pdf");


                    if (!isPdf) {

                        showMessage(
                            "Please select a PDF resume.",
                            false
                        );

                        return;
                    }
                }


                // ==================================
                // CREATE FORM DATA
                // ==================================

                const formData =
                    new FormData();


                formData.append(
                    "name",
                    name
                );

                formData.append(
                    "email",
                    email
                );

                formData.append(
                    "cgpa",
                    cgpa
                );


                // Only send password when
                // the student wants to change it.

                if (password) {

                    formData.append(
                        "password",
                        password
                    );
                }


                // Only send resume when selected.

                if (resume) {

                    formData.append(
                        "resume",
                        resume
                    );
                }


                // ==================================
                // SUBMIT UPDATE
                // ==================================

                const updateButton =
                    document.getElementById(
                        "updateButton"
                    );


                updateButton.disabled = true;

                updateButton.textContent =
                    "Updating...";


                try {

                    const response =
                        await fetch(
                            `/students/${encodeURIComponent(studentId)}`,
                            {
                                method: "PUT",
                                credentials: "same-origin",
                                body: formData
                            }
                        );


                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        throw new Error(
                            errorText ||
                            "Update failed"
                        );
                    }


                    const updatedStudent =
                        await response.json();


                    // ==================================
                    // UPDATE LOCAL STORAGE
                    // ==================================

                    if (updatedStudent.id) {

                        localStorage.setItem(
                            "studentId",
                            updatedStudent.id
                        );
                    }


                    localStorage.setItem(
                        "studentName",
                        updatedStudent.name || name
                    );


                    localStorage.setItem(
                        "studentEmail",
                        updatedStudent.email || email
                    );


                    showMessage(
                        "Profile updated successfully!",
                        true
                    );


                    // ==================================
                    // REDIRECT
                    // ==================================

                    setTimeout(
                        function () {

                            window.location.href =
                                "/profile.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        "Error updating profile:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Error updating profile.",
                        false
                    );


                    updateButton.disabled =
                        false;

                    updateButton.textContent =
                        "Update Profile";
                }

            }
        );


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(
            message,
            success
        ) {

            const messageElement =
                document.getElementById(
                    "message"
                );


            messageElement.textContent =
                message;


            messageElement.className =
                success
                    ? "success"
                    : "error";
        }

    </script>

</body>

</html>
