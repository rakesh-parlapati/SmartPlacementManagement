<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | SPMS</title>

<!-- GLOBAL AUTH + THEME -->
<script src="/JS/auth.js"></script>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        background: linear-gradient(
            120deg,
            #e0f2fe,
            #dbeafe,
            #eff6ff,
            #dbeafe
        );

        background-size: 400% 400%;

        animation:
            backgroundMove 12s ease infinite;

        overflow: hidden;

        position: relative;

        transition:
            background 0.3s ease,
            color 0.3s ease;
    }

    /* ================================
       BACKGROUND
    ================================= */

    @keyframes backgroundMove {

        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }
    }

    .circle {
        position: absolute;

        border-radius: 50%;

        pointer-events: none;

        z-index: 0;
    }

    .circle-one {
        width: 300px;
        height: 300px;

        background: rgba(96, 165, 250, 0.22);

        top: -100px;
        left: -100px;

        animation:
            moveOne 10s ease-in-out infinite;
    }

    .circle-two {
        width: 350px;
        height: 350px;

        background: rgba(147, 197, 253, 0.28);

        right: -120px;
        bottom: -120px;

        animation:
            moveTwo 12s ease-in-out infinite;
    }

    @keyframes moveOne {

        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(120px, 100px);
        }
    }

    @keyframes moveTwo {

        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(-100px, -100px);
        }
    }

    /* ================================
       CARD
    ================================= */

    .card {
        width: 100%;
        max-width: 450px;

        background: rgba(255, 255, 255, 0.97);

        padding: 40px;

        border-radius: 18px;

        box-shadow:
            0 20px 60px
            rgba(30, 64, 175, 0.18);

        position: relative;

        z-index: 5;

        animation:
            cardEnter 0.7s ease;

        transition:
            background 0.3s ease,
            box-shadow 0.3s ease;
    }

    @keyframes cardEnter {

        from {
            opacity: 0;

            transform:
                translateY(30px)
                scale(0.95);
        }

        to {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }

    /* ================================
       THEME BUTTON
    ================================= */

    .theme-btn {
        position: absolute;

        top: 15px;
        right: 15px;

        border: none;

        background: #eff6ff;
        color: #2563eb;

        padding: 8px 12px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 12px;
        font-weight: bold;

        transition: 0.25s;
    }

    .theme-btn:hover {
        background: #dbeafe;
    }

    /* ================================
       LOGO
    ================================= */

    .logo {
        width: 65px;
        height: 65px;

        margin: 0 auto 20px;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #3b82f6;

        color: white;

        border-radius: 16px;

        font-size: 19px;
        font-weight: bold;

        box-shadow:
            0 6px 18px
            rgba(59, 130, 246, 0.25);
    }

    /* ================================
       TITLE
    ================================= */

    h1 {
        text-align: center;

        color: #1e293b;

        font-size: 28px;

        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;

        color: #64748b;

        font-size: 14px;

        line-height: 1.5;

        margin-bottom: 28px;
    }

    /* ================================
       STEPS
    ================================= */

    .steps {
        display: flex;

        align-items: center;
        justify-content: center;

        margin-bottom: 30px;
    }

    .step {
        width: 32px;
        height: 32px;

        border-radius: 50%;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #e2e8f0;

        color: #64748b;

        font-size: 13px;
        font-weight: bold;

        transition: 0.3s;
    }

    .step.active {
        background: #3b82f6;
        color: white;
    }

    .step.completed {
        background: #16a34a;
        color: white;
    }

    .step-line {
        width: 55px;
        height: 2px;

        background: #e2e8f0;

        transition: 0.3s;
    }

    .step-line.active {
        background: #3b82f6;
    }

    /* ================================
       FORM
    ================================= */

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;

        color: #334155;

        font-size: 14px;

        font-weight: bold;

        margin-bottom: 8px;
    }

    input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #cbd5e1;

        border-radius: 9px;

        outline: none;

        font-size: 15px;

        background: white;

        color: #1e293b;

        transition: 0.25s;
    }

    input:focus {
        border-color: #60a5fa;

        box-shadow:
            0 0 0 3px
            rgba(96, 165, 250, 0.15);
    }

    /* ================================
       OTP
    ================================= */

    #otp {
        text-align: center;

        letter-spacing: 8px;

        font-size: 20px;

        font-weight: bold;
    }

    /* ================================
       BUTTON
    ================================= */

    .primary-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 9px;

        background: #3b82f6;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.25s;
    }

    .primary-btn:hover {
        background: #2563eb;

        transform: translateY(-2px);

        box-shadow:
            0 8px 20px
            rgba(37, 99, 235, 0.25);
    }

    .primary-btn:disabled {
        background: #93c5fd;

        cursor: not-allowed;

        transform: none;

        box-shadow: none;
    }

    /* ================================
       BACK BUTTON
    ================================= */

    .secondary-btn {
        width: 100%;

        padding: 12px;

        margin-top: 10px;

        border: 1px solid #cbd5e1;

        border-radius: 9px;

        background: white;

        color: #334155;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .secondary-btn:hover {
        background: #f8fafc;

        border-color: #94a3b8;
    }

    /* ================================
       MESSAGE
    ================================= */

    #message {
        min-height: 20px;

        text-align: center;

        margin-top: 16px;

        font-size: 14px;

        font-weight: bold;

        line-height: 1.4;
    }

    #message.success {
        color: #16a34a;
    }

    #message.error {
        color: #dc2626;
    }

    #message.info {
        color: #2563eb;
    }

    /* ================================
       STEP SECTIONS
    ================================= */

    .form-section {
        display: none;
    }

    .form-section.active {
        display: block;

        animation:
            sectionEnter 0.35s ease;
    }

    @keyframes sectionEnter {

        from {
            opacity: 0;

            transform:
                translateX(15px);
        }

        to {
            opacity: 1;

            transform:
                translateX(0);
        }
    }

    /* ================================
       PASSWORD INFO
    ================================= */

    .password-info {
        margin-top: 8px;

        color: #64748b;

        font-size: 12px;

        line-height: 1.5;
    }

    /* ================================
       RESEND OTP
    ================================= */

    .resend-area {
        text-align: center;

        margin-top: 15px;

        font-size: 13px;

        color: #64748b;
    }

    .resend-btn {
        border: none;

        background: transparent;

        color: #2563eb;

        font-weight: bold;

        cursor: pointer;

        padding: 0;

        font-size: 13px;
    }

    .resend-btn:disabled {
        color: #94a3b8;

        cursor: not-allowed;
    }

    /* ================================
       LOGIN LINK
    ================================= */

    .login-link {
        text-align: center;

        margin-top: 24px;

        padding-top: 18px;

        border-top:
            1px solid #e2e8f0;
    }

    .login-link a {
        color: #2563eb;

        text-decoration: none;

        font-size: 14px;

        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    /* ================================
       DARK MODE
    ================================= */

    body.dark-mode {
        background:
            linear-gradient(
                120deg,
                #0f172a,
                #172554,
                #1e293b,
                #0f172a
            );

        color: #e2e8f0;
    }

    body.dark-mode .card {
        background: rgba(30, 41, 59, 0.97);

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.45);
    }

    body.dark-mode h1 {
        color: #f1f5f9;
    }

    body.dark-mode .subtitle {
        color: #94a3b8;
    }

    body.dark-mode label {
        color: #e2e8f0;
    }

    body.dark-mode input {
        background: #0f172a;

        color: #e2e8f0;

        border-color: #475569;
    }

    body.dark-mode input::placeholder {
        color: #94a3b8;
    }

    body.dark-mode input:focus {
        border-color: #60a5fa;
    }

    body.dark-mode .step {
        background: #475569;

        color: #cbd5e1;
    }

    body.dark-mode .step.active {
        background: #3b82f6;

        color: white;
    }

    body.dark-mode .step.completed {
        background: #16a34a;

        color: white;
    }

    body.dark-mode .step-line {
        background: #475569;
    }

    body.dark-mode .step-line.active {
        background: #3b82f6;
    }

    body.dark-mode .secondary-btn {
        background: #334155;

        color: #e2e8f0;

        border-color: #475569;
    }

    body.dark-mode .secondary-btn:hover {
        background: #475569;
    }

    body.dark-mode .password-info {
        color: #94a3b8;
    }

    body.dark-mode .resend-area {
        color: #94a3b8;
    }

    body.dark-mode .login-link {
        border-top-color: #475569;
    }

    body.dark-mode .theme-btn {
        background: #334155;

        color: #facc15;
    }

    body.dark-mode .theme-btn:hover {
        background: #475569;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 500px) {

        .card {
            padding: 30px 24px;
        }

        h1 {
            font-size: 25px;
        }

        .step-line {
            width: 35px;
        }
    }

</style>


</head>

<body>


<!-- ================================
     BACKGROUND
================================= -->

<div class="circle circle-one"></div>
<div class="circle circle-two"></div>


<!-- ================================
     CARD
================================= -->

<div class="card">

    <!-- THEME -->

    <button
        type="button"
        class="theme-btn"
        onclick="toggleDarkMode()">

        🌙 Dark Mode

    </button>


    <!-- LOGO -->

    <div class="logo">
        SPMS
    </div>


    <!-- TITLE -->

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Reset your student account password securely.
    </p>


    <!-- ================================
         STEPS
    ================================= -->

    <div class="steps">

        <div
            class="step active"
            id="step1">

            1

        </div>

        <div
            class="step-line"
            id="line1">
        </div>

        <div
            class="step"
            id="step2">

            2

        </div>

        <div
            class="step-line"
            id="line2">
        </div>

        <div
            class="step"
            id="step3">

            3

        </div>

    </div>


    <!-- ================================
         STEP 1
    ================================= -->

    <div
        class="form-section active"
        id="emailSection">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required>

        </div>

        <button
            type="button"
            class="primary-btn"
            id="sendOtpButton"
            onclick="sendOtp()">

            Send OTP

        </button>

    </div>


    <!-- ================================
         STEP 2
    ================================= -->

    <div
        class="form-section"
        id="otpSection">

        <div class="form-group">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code">

            <p
                class="password-info"
                id="otpInfo">

                An OTP will be sent to your registered email.

            </p>

        </div>

        <button
            type="button"
            class="primary-btn"
            id="verifyOtpButton"
            onclick="verifyOtp()">

            Verify OTP

        </button>


        <div class="resend-area">

            Didn't receive the OTP?

            <button
                type="button"
                class="resend-btn"
                id="resendButton"
                onclick="resendOtp()">

                Resend OTP

            </button>

        </div>


        <button
            type="button"
            class="secondary-btn"
            onclick="goToEmailStep()">

            ← Change Email

        </button>

    </div>


    <!-- ================================
         STEP 3
    ================================= -->

    <div
        class="form-section"
        id="passwordSection">

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password">

            <p class="password-info">
                Use at least 6 characters.
            </p>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password">

        </div>


        <button
            type="button"
            class="primary-btn"
            id="resetButton"
            onclick="resetPassword()">

            Reset Password

        </button>

    </div>


    <!-- MESSAGE -->

    <p id="message"></p>


    <!-- LOGIN -->

    <div class="login-link">

        <a href="/login.html">
            ← Back to Login
        </a>

    </div>

</div>


<!-- ================================
     JAVASCRIPT
================================= -->

<script>

    // ==========================================
    // VARIABLES
    // ==========================================

    let resetEmail = "";
    let verifiedOtp = "";


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            type || "";
    }


    // ==========================================
    // STEP MANAGEMENT
    // ==========================================

    function showSection(sectionId) {

        document
            .querySelectorAll(".form-section")
            .forEach(function(section) {

                section.classList.remove("active");

            });

        document
            .getElementById(sectionId)
            .classList.add("active");
    }


    function updateSteps(step) {

        const step1 =
            document.getElementById("step1");

        const step2 =
            document.getElementById("step2");

        const step3 =
            document.getElementById("step3");

        const line1 =
            document.getElementById("line1");

        const line2 =
            document.getElementById("line2");


        step1.classList.remove(
            "active",
            "completed"
        );

        step2.classList.remove(
            "active",
            "completed"
        );

        step3.classList.remove(
            "active",
            "completed"
        );

        line1.classList.remove("active");
        line2.classList.remove("active");


        if (step === 1) {

            step1.classList.add("active");

        }


        if (step === 2) {

            step1.classList.add("completed");

            step2.classList.add("active");

            line1.classList.add("active");

        }


        if (step === 3) {

            step1.classList.add("completed");

            step2.classList.add("completed");

            step3.classList.add("active");

            line1.classList.add("active");

            line2.classList.add("active");

        }
    }


    // ==========================================
    // STEP 1
    // SEND OTP
    // ==========================================

    async function sendOtp() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const button =
            document.getElementById(
                "sendOtpButton"
            );


        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if (
            !email.includes("@") ||
            !email.includes(".")
        ) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;
        }


        resetEmail = email;

        button.disabled = true;

        button.textContent =
            "Sending OTP...";

        showMessage(
            "Please wait...",
            "info"
        );


        try {

            const response =
                await fetch(
                    "/auth/forgot-password",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                email: email
                            })
                    }
                );


            const result =
                await response.text();


            if (response.ok) {

                showSection(
                    "otpSection"
                );

                updateSteps(2);

                showMessage(
                    "OTP sent successfully. Check your email.",
                    "success"
                );

                document
                    .getElementById("otpInfo")
                    .textContent =
                    "Enter the 6-digit OTP sent to your registered email.";

            } else {

                showMessage(
                    result ||
                    "Unable to send OTP.",
                    "error"
                );
            }

        } catch (error) {

            console.error(
                "Send OTP error:",
                error
            );

            showMessage(
                "Unable to connect to server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Send OTP";
        }
    }


    // ==========================================
    // STEP 2
    // VERIFY OTP
    // ==========================================

    async function verifyOtp() {

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();


        const button =
            document.getElementById(
                "verifyOtpButton"
            );


        if (!otp) {

            showMessage(
                "Please enter the OTP.",
                "error"
            );

            return;
        }


        if (!/^\d{6}$/.test(otp)) {

            showMessage(
                "OTP must contain exactly 6 digits.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                    "/auth/verify-otp",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                email: resetEmail,
                                otp: otp
                            })
                    }
                );


            const result =
                await response.text();


            if (response.ok) {

                verifiedOtp = otp;

                showSection(
                    "passwordSection"
                );

                updateSteps(3);

                showMessage(
                    "OTP verified successfully.",
                    "success"
                );

            } else {

                showMessage(
                    result ||
                    "Invalid or expired OTP.",
                    "error"
                );
            }

        } catch (error) {

            console.error(
                "OTP verification error:",
                error
            );

            showMessage(
                "Unable to connect to server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Verify OTP";
        }
    }


    // ==========================================
    // STEP 3
    // RESET PASSWORD
    // ==========================================

    async function resetPassword() {

        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const button =
            document.getElementById(
                "resetButton"
            );


        if (!newPassword) {

            showMessage(
                "Please enter a new password.",
                "error"
            );

            return;
        }


        if (newPassword.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        if (!resetEmail || !verifiedOtp) {

            showMessage(
                "Password reset verification is incomplete.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Resetting Password...";


        try {

            const response =
                await fetch(
                    "/auth/reset-password",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                email: resetEmail,
                                otp: verifiedOtp,
                                newPassword:
                                    newPassword
                            })
                    }
                );


            const result =
                await response.text();


            if (response.ok) {

                showMessage(
                    "Password reset successfully! Redirecting to login...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "/login.html";

                    },
                    1500
                );

            } else {

                showMessage(
                    result ||
                    "Unable to reset password.",
                    "error"
                );
            }

        } catch (error) {

            console.error(
                "Password reset error:",
                error
            );

            showMessage(
                "Unable to connect to server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Reset Password";
        }
    }


    // ==========================================
    // CHANGE EMAIL
    // ==========================================

    function goToEmailStep() {

        resetEmail = "";
        verifiedOtp = "";

        document
            .getElementById("otp")
            .value = "";

        showSection(
            "emailSection"
        );

        updateSteps(1);

        showMessage(
            "",
            ""
        );
    }


    // ==========================================
    // RESEND OTP
    // ==========================================

    async function resendOtp() {

        if (!resetEmail) {

            goToEmailStep();

            return;
        }


        const button =
            document.getElementById(
                "resendButton"
            );


        button.disabled = true;


        let seconds = 30;

        button.textContent =
            "Resend in " +
            seconds +
            "s";


        try {

            const response =
                await fetch(
                    "/auth/forgot-password",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                email: resetEmail
                            })
                    }
                );


            const result =
                await response.text();


            if (response.ok) {

                showMessage(
                    "A new OTP has been sent.",
                    "success"
                );

            } else {

                showMessage(
                    result ||
                    "Unable to resend OTP.",
                    "error"
                );
            }

        } catch (error) {

            console.error(
                "Resend OTP error:",
                error
            );

            showMessage(
                "Unable to connect to server.",
                "error"
            );
        }


        const timer =
            setInterval(
                function() {

                    seconds--;

                    button.textContent =
                        "Resend in " +
                        seconds +
                        "s";


                    if (seconds <= 0) {

                        clearInterval(timer);

                        button.disabled =
                            false;

                        button.textContent =
                            "Resend OTP";
                    }

                },
                1000
            );
    }


    // ==========================================
    // OTP ONLY NUMBERS
    // ==========================================

    document
        .getElementById("otp")
        .addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .substring(0, 6);

            }
        );

</script>


</body>

</html>
