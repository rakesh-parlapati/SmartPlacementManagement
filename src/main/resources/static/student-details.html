<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Details | SPMS</title>

<!-- COMMON AUTHENTICATION + THEME -->
<script src="/JS/auth.js"></script>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        color: #222;
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* ==============================
       HEADER
    ============================== */

    .header {
        background: #1f3c88;
        color: white;

        padding: 18px 30px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 15px;
    }

    .header h2 {
        font-size: 24px;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .header-right span {
        font-weight: bold;
    }

    .header button {
        border: none;

        padding: 9px 15px;

        border-radius: 6px;

        cursor: pointer;

        font-weight: bold;
    }

    .theme-btn {
        background: white;
        color: #1f3c88;
    }

    .logout-btn {
        background: #dc3545;
        color: white;
    }

    .header button:hover {
        opacity: 0.9;
    }

    /* ==============================
       CONTAINER
    ============================== */

    .container {
        max-width: 850px;

        margin: 35px auto;

        padding: 0 20px 40px;
    }

    /* ==============================
       TOP SECTION
    ============================== */

    .top-section {
        display: flex;

        justify-content: space-between;
        align-items: center;

        gap: 15px;

        margin-bottom: 25px;
    }

    .top-section h1 {
        font-size: 30px;
        color: #1f3c88;
    }

    .back-btn {
        background: #6c757d;
        color: white;

        text-decoration: none;

        padding: 11px 18px;

        border-radius: 6px;

        font-weight: bold;
    }

    .back-btn:hover {
        background: #545b62;
    }

    /* ==============================
       CARD
    ============================== */

    .details-card {
        background: white;

        border-radius: 12px;

        padding: 30px;

        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .profile-header {
        text-align: center;

        border-bottom: 1px solid #ddd;

        padding-bottom: 25px;

        margin-bottom: 25px;
    }

    .profile-icon {
        width: 90px;
        height: 90px;

        background: #1f3c88;
        color: white;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 40px;

        margin: 0 auto 15px;
    }

    .profile-header h2 {
        color: #1f3c88;

        margin-bottom: 7px;

        word-break: break-word;
    }

    .student-id {
        color: #777;

        font-size: 14px;
    }

    /* ==============================
       DETAILS
    ============================== */

    .details-grid {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 18px;
    }

    .detail-box {
        background: #f8f9fa;

        border: 1px solid #e1e5e9;

        border-radius: 8px;

        padding: 17px;
    }

    .detail-box.full {
        grid-column: 1 / -1;
    }

    .detail-label {
        color: #777;

        font-size: 13px;

        margin-bottom: 6px;

        font-weight: bold;
    }

    .detail-value {
        font-size: 17px;

        font-weight: bold;

        color: #333;

        word-break: break-word;
    }

    .cgpa {
        color: #198754;
    }

    .percentage {
        color: #6f42c1;
    }

    .phone {
        color: #007bff;
    }

    /* ==============================
       SECURITY
    ============================== */

    .security-box {
        background: #eef2ff;

        border: 1px solid #cfd8ff;

        color: #1f3c88;

        padding: 14px;

        border-radius: 8px;

        line-height: 1.5;
    }

    /* ==============================
       RESUME
    ============================== */

    .resume-section {
        margin-top: 25px;

        padding-top: 25px;

        border-top: 1px solid #ddd;
    }

    .resume-section h3 {
        margin-bottom: 15px;

        color: #333;
    }

    .resume-available {
        background: #d4edda;

        color: #155724;

        padding: 14px;

        border-radius: 7px;

        line-height: 1.6;
    }

    .resume-missing {
        background: #f8d7da;

        color: #721c24;

        padding: 14px;

        border-radius: 7px;
    }

    .resume-btn {
        display: inline-block;

        margin-top: 10px;

        background: #6f42c1;

        color: white;

        text-decoration: none;

        padding: 10px 16px;

        border-radius: 6px;

        font-weight: bold;
    }

    .resume-btn:hover {
        opacity: 0.9;
    }

    /* ==============================
       ACTIONS
    ============================== */

    .actions {
        display: flex;

        gap: 12px;

        margin-top: 30px;
    }

    .action-btn {
        flex: 1;

        border: none;

        padding: 13px;

        border-radius: 7px;

        color: white;

        font-weight: bold;

        font-size: 15px;

        cursor: pointer;

        text-decoration: none;

        text-align: center;
    }

    .edit-btn {
        background: #007bff;
    }

    .delete-btn {
        background: #dc3545;
    }

    .students-btn {
        background: #6c757d;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    /* ==============================
       LOADING / ERROR
    ============================== */

    .loading {
        background: white;

        padding: 45px;

        border-radius: 10px;

        text-align: center;

        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .loading-text {
        color: #666;

        font-size: 17px;
    }

    .error {
        color: #dc3545;

        font-weight: bold;

        margin-bottom: 20px;
    }

    /* ==============================
       DARK MODE
    ============================== */

    body.dark-mode {
        background: #121212;
        color: #eeeeee;
    }

    body.dark-mode .details-card,
    body.dark-mode .loading {
        background: #1e1e1e;
        color: #eeeeee;
    }

    body.dark-mode .profile-header {
        border-bottom-color: #444;
    }

    body.dark-mode .profile-header h2,
    body.dark-mode .top-section h1 {
        color: #8fb3ff;
    }

    body.dark-mode .student-id {
        color: #aaa;
    }

    body.dark-mode .detail-box {
        background: #2a2a2a;

        border-color: #444;
    }

    body.dark-mode .detail-label {
        color: #aaa;
    }

    body.dark-mode .detail-value {
        color: #eeeeee;
    }

    body.dark-mode .security-box {
        background: #27345f;

        border-color: #3e4f88;

        color: #b8c9ff;
    }

    body.dark-mode .resume-section {
        border-top-color: #444;
    }

    body.dark-mode .resume-section h3 {
        color: #eeeeee;
    }

    body.dark-mode .loading-text {
        color: #bbb;
    }

    body.dark-mode .theme-btn {
        background: #f8f9fa;
        color: #212529;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

        .header {
            padding: 15px;

            flex-direction: column;

            align-items: flex-start;
        }

        .header h2 {
            font-size: 20px;
        }

        .header-right {
            width: 100%;

            flex-wrap: wrap;
        }

        .header-right span {
            display: none;
        }

        .container {
            padding: 0 10px 30px;

            margin-top: 25px;
        }

        .top-section {
            flex-direction: column;

            align-items: flex-start;
        }

        .top-section h1 {
            font-size: 25px;
        }

        .back-btn {
            width: 100%;

            text-align: center;
        }

        .details-card {
            padding: 20px;
        }

        .details-grid {
            grid-template-columns: 1fr;
        }

        .detail-box.full {
            grid-column: auto;
        }

        .actions {
            flex-direction: column;
        }

        .action-btn {
            width: 100%;
        }
    }

</style>


</head>

<body>


<!-- ==============================
     HEADER
============================== -->

<header class="header">

    <h2>
        SPMS Admin
    </h2>

    <div class="header-right">

        <span>
            Administrator
        </span>

        <button
            type="button"
            class="theme-btn"
            onclick="toggleDarkMode()">

            🌙 Dark Mode

        </button>

        <button
            type="button"
            class="logout-btn"
            onclick="logoutUser()">

            Logout

        </button>

    </div>

</header>


<!-- ==============================
     MAIN
============================== -->

<div class="container">

    <div class="top-section">

        <h1>
            👨‍🎓 Student Details
        </h1>

        <a
            href="/students.html"
            class="back-btn">

            ← Students

        </a>

    </div>


    <div id="content">

        <div class="loading">

            <div class="loading-text">

                Loading student information...

            </div>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // GET STUDENT ID
    // ==========================================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const studentId =
        urlParams.get("id");


    // ==========================================
    // PAGE INITIALIZATION
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (
                typeof requireAdmin !==
                "function"
            ) {

                showError(
                    "Authentication system not found."
                );

                return;
            }


            if (!requireAdmin()) {
                return;
            }


            loadStudent();
        }
    );


    // ==========================================
    // LOAD STUDENT
    // ==========================================

    async function loadStudent() {

        if (!studentId) {

            showError(
                "Student ID is missing."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "/students/" +
                    encodeURIComponent(
                        studentId
                    ),
                    {
                        method: "GET",

                        headers: {
                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "same-origin"
                    }
                );


            if (
                response.status ===
                401
            ) {

                window.location.href =
                    "/login.html";

                return;
            }


            if (
                response.status ===
                403
            ) {

                showError(
                    "Administrator access is required."
                );

                return;
            }


            if (
                response.status ===
                404
            ) {

                showError(
                    "Student not found."
                );

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Unable to load student. HTTP " +
                    response.status
                );
            }


            const student =
                await response.json();


            if (
                !student ||
                student.id === undefined ||
                student.id === null
            ) {

                throw new Error(
                    "Invalid student data received."
                );
            }


            showStudent(student);

        } catch (error) {

            console.error(
                "Load student error:",
                error
            );


            showError(
                error.message ||
                "Unable to load student information."
            );
        }
    }


    // ==========================================
    // SHOW STUDENT
    // ==========================================

    function showStudent(student) {

        const cgpaNumber =
            Number(student.cgpa);


        const hasCgpa =
            student.cgpa !== null &&
            student.cgpa !== undefined &&
            student.cgpa !== "" &&
            Number.isFinite(
                cgpaNumber
            );


        const cgpa =
            hasCgpa
                ? cgpaNumber.toFixed(2)
                : "-";


        const percentage =
            hasCgpa
                ? (
                    cgpaNumber * 10
                ).toFixed(2) + "%"
                : "-";


        // ======================================
        // RESUME
        // ======================================

        const hasResume =
            student.resume &&
            String(student.resume)
                .trim() !== "" &&
            String(student.resume)
                .toLowerCase() !==
                "null";


        // ======================================
        // FIRST LETTER
        // ======================================

        const firstLetter =
            String(
                student.name ||
                "S"
            )
                .trim()
                .charAt(0)
                .toUpperCase();


        // ======================================
        // PHONE
        // ======================================

        const phone =
            student.phone &&
            String(student.phone)
                .trim() !== "" &&
            String(student.phone)
                .toLowerCase() !==
                "null"
                ? String(student.phone)
                : "Not Available";


        // ======================================
        // BRANCH
        // ======================================

        const branch =
            student.branch &&
            String(student.branch)
                .trim() !== "" &&
            String(student.branch)
                .toLowerCase() !==
                "null"
                ? String(student.branch)
                : "Not Available";


        const safeId =
            String(student.id);


        // ======================================
        // DISPLAY
        // ======================================

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="details-card">


                <!-- PROFILE HEADER -->

                <div class="profile-header">

                    <div class="profile-icon">

                        ${escapeHtml(
                            firstLetter
                        )}

                    </div>


                    <h2>

                        ${escapeHtml(
                            student.name ||
                            "N/A"
                        )}

                    </h2>


                    <div class="student-id">

                        Student ID:
                        ${escapeHtml(
                            safeId
                        )}

                    </div>

                </div>


                <!-- DETAILS -->

                <div class="details-grid">


                    <!-- STUDENT ID -->

                    <div class="detail-box">

                        <div class="detail-label">

                            Student ID

                        </div>

                        <div class="detail-value">

                            ${escapeHtml(
                                safeId
                            )}

                        </div>

                    </div>


                    <!-- STUDENT NAME -->

                    <div class="detail-box">

                        <div class="detail-label">

                            Student Name

                        </div>

                        <div class="detail-value">

                            ${escapeHtml(
                                student.name ||
                                "N/A"
                            )}

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="detail-box full">

                        <div class="detail-label">

                            Email Address

                        </div>

                        <div class="detail-value">

                            ${escapeHtml(
                                student.email ||
                                "N/A"
                            )}

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="detail-box">

                        <div class="detail-label">

                            Phone Number

                        </div>

                        <div class="detail-value phone">

                            ${escapeHtml(
                                phone
                            )}

                        </div>

                    </div>


                    <!-- BRANCH -->

                    <div class="detail-box">

                        <div class="detail-label">

                            Branch

                        </div>

                        <div class="detail-value">

                            ${escapeHtml(
                                branch
                            )}

                        </div>

                    </div>


                    <!-- CGPA -->

                    <div class="detail-box">

                        <div class="detail-label">

                            CGPA

                        </div>

                        <div class="detail-value cgpa">

                            ${cgpa}

                        </div>

                    </div>


                    <!-- PERCENTAGE -->

                    <div class="detail-box">

                        <div class="detail-label">

                            Percentage

                        </div>

                        <div class="detail-value percentage">

                            ${percentage}

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="detail-box full">

                        <div class="detail-label">

                            Password

                        </div>

                        <div class="security-box">

                            🔒 Password is hidden
                            for security.

                            <br>

                            Passwords are stored
                            securely and are never
                            displayed here.

                        </div>

                    </div>


                    <!-- RESUME FILE -->

                    <div class="detail-box full">

                        <div class="detail-label">

                            Resume File

                        </div>

                        <div class="detail-value">

                            ${
                                hasResume
                                    ? escapeHtml(
                                        String(
                                            student.resume
                                        )
                                    )
                                    : "No resume uploaded"
                            }

                        </div>

                    </div>

                </div>


                <!-- RESUME SECTION -->

                <div class="resume-section">

                    <h3>

                        📄 Resume

                    </h3>


                    ${
                        hasResume

                            ? `

                                <div class="resume-available">

                                    Resume is available.

                                    <br>

                                    <a
                                        href="/students/${encodeURIComponent(
                                            safeId
                                        )}/resume"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="resume-btn">

                                        📄 View Resume

                                    </a>

                                </div>

                              `

                            : `

                                <div class="resume-missing">

                                    This student has not
                                    uploaded a resume.

                                </div>

                              `
                    }

                </div>


                <!-- ACTIONS -->

                <div class="actions">


                    <a
                        href="/student-update.html?id=${encodeURIComponent(
                            safeId
                        )}"
                        class="action-btn edit-btn">

                        ✏️ Edit Student

                    </a>


                    <button
                        type="button"
                        class="action-btn delete-btn"
                        onclick="deleteStudent('${escapeJS(
                            safeId
                        )}')">

                        🗑️ Delete Student

                    </button>


                    <a
                        href="/students.html"
                        class="action-btn students-btn">

                        👨‍🎓 All Students

                    </a>

                </div>

            </div>

        `;
    }


    // ==========================================
    // DELETE STUDENT
    // ==========================================

    async function deleteStudent(
        id
    ) {

        if (!id) {

            alert(
                "Invalid student ID."
            );

            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this student?\n\n" +
                "This action cannot be undone."
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/students/" +
                    encodeURIComponent(id),
                    {
                        method: "DELETE",

                        credentials:
                            "same-origin"
                    }
                );


            if (
                response.status ===
                401
            ) {

                window.location.href =
                    "/login.html";

                return;
            }


            if (
                response.status ===
                403
            ) {

                alert(
                    "Administrator access is required."
                );

                return;
            }


            if (!response.ok) {

                let message =
                    "Unable to delete student.";


                try {

                    const text =
                        await response.text();


                    if (text) {
                        message = text;
                    }

                } catch (error) {

                    console.error(
                        error
                    );
                }


                throw new Error(
                    message
                );
            }


            alert(
                "Student deleted successfully."
            );


            window.location.href =
                "/students.html";

        } catch (error) {

            console.error(
                "Delete student error:",
                error
            );


            alert(
                error.message ||
                "Unable to delete student."
            );
        }
    }


    // ==========================================
    // ERROR
    // ==========================================

    function showError(
        message
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="loading">

                <div class="error">

                    ${escapeHtml(
                        message
                    )}

                </div>


                <a
                    href="/students.html"
                    class="back-btn">

                    ← Back to Students

                </a>

            </div>

        `;
    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(
        value
    ) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    // ==========================================
    // ESCAPE JAVASCRIPT STRING
    // ==========================================

    function escapeJS(
        value
    ) {

        return String(value)
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '\\"'
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                "\\r"
            );
    }

</script>


</body>

</html>
